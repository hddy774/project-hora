name: Build and publish Android release
on:
  push:
    tags: ['v*.*.0']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing merged release tag
        required: true
        default: v1.2.0
        type: string
      generate_signing_key:
        description: Generate a new one-time signing key (requires reinstall)
        required: true
        default: false
        type: boolean
      signed_run_id:
        description: Recover verified signed-release artifact from this run ID
        required: false
        default: ''
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SIGNED_RUN_ID: ${{ inputs.signed_run_id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag and merged source
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.0$ ]]
          if [[ -n "$SIGNED_RUN_ID" ]]; then [[ "$SIGNED_RUN_ID" =~ ^[0-9]+$ ]]; fi
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          version = ET.parse('src/AlphaExchange.Android/AlphaExchange.Android.csproj').findtext('.//ApplicationDisplayVersion')
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag and application version differ'
          PY
      - uses: actions/setup-dotnet@v4
        if: ${{ !inputs.signed_run_id }}
        with:
          dotnet-version: '9.0.318'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Install Android workload
        if: ${{ !inputs.signed_run_id }}
        run: dotnet workload install android --skip-manifest-update
      - name: Verify simulation and artwork
        if: ${{ !inputs.signed_run_id }}
        run: |
          mkdir -p dist
          set -o pipefail
          dotnet run --project tests/AlphaExchange.Checks -c Release | tee dist/CORE-CHECKS.txt
          python3 scripts/check-artwork.py | tee dist/ARTWORK-CHECKS.txt
      - name: Build APK from merged release tag
        if: ${{ !inputs.signed_run_id }}
        run: |
          dotnet publish src/AlphaExchange.Android -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -o dist/build
          cp dist/build/com.alphaexchange.offline.apk dist/AlphaExchange-unsigned.apk
          git archive --format=zip --output=dist/AlphaExchange-Source.zip "$RELEASE_TAG"
          cp VERIFICATION.txt dist/VERIFICATION.txt
      - name: Keep unsigned build available for inspection
        if: ${{ !inputs.signed_run_id }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-build
          path: |
            dist/AlphaExchange-unsigned.apk
            dist/AlphaExchange-Source.zip
            dist/CORE-CHECKS.txt
            dist/ARTWORK-CHECKS.txt
          retention-days: 30
      - name: Sign APK with selected Android identity
        if: ${{ !inputs.signed_run_id }}
        env:
          GENERATE_SIGNING_KEY: ${{ inputs.generate_signing_key || false }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          bash scripts/sign-release.sh dist/AlphaExchange-unsigned.apk dist/AlphaExchange.apk dist/SIGNING-INFO.txt
      - name: Recover previously verified signed APK
        if: ${{ inputs.signed_run_id }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-signed-release
          path: dist
          run-id: ${{ inputs.signed_run_id }}
          github-token: ${{ github.token }}
      - name: Verify APK identity and release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ -n "$SIGNED_RUN_ID" ]]; then
            (cd dist && sha256sum --check SHA256SUMS.txt)
            previous_workflow_commit=$(gh api "repos/$GH_REPO/actions/runs/$SIGNED_RUN_ID" --jq .head_sha)
            git merge-base --is-ancestor "$previous_workflow_commit" origin/main
            source_commit=$(git rev-parse HEAD)
            grep -Fx "Source commit: $source_commit" dist/SIGNING-INFO.txt
            test "$(unzip -z dist/AlphaExchange-Source.zip | tail -n 1)" = "$source_commit"
          fi
          expected_certificate=$(sed -n 's/^Certificate SHA-256: //p' dist/SIGNING-INFO.txt)
          [[ "$expected_certificate" =~ ^[a-f0-9]{64}$ ]]
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/AlphaExchange.apk > "$RUNNER_TEMP/hora-apk-verification.txt"
          grep -F "Signer #1 certificate SHA-256 digest: $expected_certificate" "$RUNNER_TEMP/hora-apk-verification.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/AlphaExchange.apk > dist/APK-BADGING.txt
          grep -F "package: name='com.alphaexchange.offline'" dist/APK-BADGING.txt
          grep -F "versionName='${RELEASE_TAG#v}'" dist/APK-BADGING.txt
          cd dist
          sha256sum AlphaExchange.apk AlphaExchange-Source.zip VERIFICATION.txt CORE-CHECKS.txt ARTWORK-CHECKS.txt APK-VERIFICATION.txt APK-BADGING.txt SIGNING-INFO.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Keep verified signed APK for recovery
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-signed-release
          path: |
            dist/AlphaExchange.apk
            dist/AlphaExchange-Source.zip
            dist/*.txt
          retention-days: 30
      - name: Publish and verify latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG · 기관 판단과 시즌 경제" --notes-file "docs/RELEASE-${RELEASE_TAG}.md"
          fi
          gh release upload "$RELEASE_TAG" --clobber dist/AlphaExchange.apk dist/AlphaExchange-Source.zip dist/VERIFICATION.txt dist/CORE-CHECKS.txt dist/ARTWORK-CHECKS.txt dist/APK-VERIFICATION.txt dist/APK-BADGING.txt dist/SIGNING-INFO.txt dist/SHA256SUMS.txt
          mkdir -p "$RUNNER_TEMP/hora-download"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/hora-download"
          (cd "$RUNNER_TEMP/hora-download" && sha256sum --check SHA256SUMS.txt)
          gh release edit "$RELEASE_TAG" --notes-file "docs/RELEASE-${RELEASE_TAG}.md" --draft=false --latest
