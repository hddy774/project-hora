name: Build and publish Android release
on:
  push:
    branches: [main]
    tags: ['v*.*.0']
    paths: ['src/AlphaExchange.Android/AlphaExchange.Android.csproj', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing merged release tag
        required: true
        default: v1.6.0
        type: string
      generate_signing_key:
        description: Generate a new one-time signing key (requires reinstall)
        required: true
        default: false
        type: boolean
      signed_run_id:
        description: Recover verified signed-release artifact from this run ID
        required: false
        default: ''
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve merged version and create immutable release tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag || '' }}
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('src/AlphaExchange.Android/AlphaExchange.Android.csproj').findtext('.//ApplicationDisplayVersion'))")
          tag="${REQUESTED_TAG:-v$version}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.0$ ]]
          test "$tag" = "v$version"
          git merge-base --is-ancestor HEAD origin/main
          source=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$source" >/dev/null
          else
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$source"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$source" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
  release:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      APK_NAME: AlphaExchange-${{ needs.prepare.outputs.tag }}.apk
      SIGNED_RUN_ID: ${{ inputs.signed_run_id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag and merged source
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.0$ ]]
          if [[ -n "$SIGNED_RUN_ID" ]]; then [[ "$SIGNED_RUN_ID" =~ ^[0-9]+$ ]]; fi
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          version = ET.parse('src/AlphaExchange.Android/AlphaExchange.Android.csproj').findtext('.//ApplicationDisplayVersion')
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag and application version differ'
          PY
      - uses: actions/setup-dotnet@v4
        if: ${{ !inputs.signed_run_id }}
        with:
          dotnet-version: '9.0.318'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Install Android workload
        if: ${{ !inputs.signed_run_id }}
        run: dotnet workload install android --skip-manifest-update
      - name: Verify simulation and artwork
        if: ${{ !inputs.signed_run_id }}
        run: |
          mkdir -p dist
          set -o pipefail
          dotnet run --project tests/AlphaExchange.Checks -c Release | tee dist/CORE-CHECKS.txt
          python3 scripts/check-artwork.py | tee dist/ARTWORK-CHECKS.txt
      - name: Build APK from merged release tag
        if: ${{ !inputs.signed_run_id }}
        run: |
          dotnet publish src/AlphaExchange.Android -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -o dist/build
          cp dist/build/com.alphaexchange.offline.apk dist/AlphaExchange-unsigned.apk
          cp VERIFICATION.txt dist/VERIFICATION.txt
      - name: Keep unsigned build available for inspection
        if: ${{ !inputs.signed_run_id }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-build
          path: |
            dist/AlphaExchange-unsigned.apk
            dist/CORE-CHECKS.txt
            dist/ARTWORK-CHECKS.txt
          retention-days: 30
      - name: Sign APK with selected Android identity
        if: ${{ !inputs.signed_run_id }}
        env:
          GENERATE_SIGNING_KEY: ${{ inputs.generate_signing_key || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          bash scripts/sign-release.sh dist/AlphaExchange-unsigned.apk "dist/$APK_NAME" dist/SIGNING-INFO.txt
      - name: Recover previously verified signed APK
        if: ${{ inputs.signed_run_id }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-signed-release
          path: dist
          run-id: ${{ inputs.signed_run_id }}
          github-token: ${{ github.token }}
      - name: Verify APK identity and release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ -n "$SIGNED_RUN_ID" ]]; then
            (cd dist && sha256sum --check SHA256SUMS.txt)
            previous_workflow_commit=$(gh api "repos/$GH_REPO/actions/runs/$SIGNED_RUN_ID" --jq .head_sha)
            git merge-base --is-ancestor "$previous_workflow_commit" origin/main
            source_commit=$(git rev-parse HEAD)
            grep -Fx "Source commit: $source_commit" dist/SIGNING-INFO.txt
          fi
          expected_certificate=$(sed -n 's/^Certificate SHA-256: //p' dist/SIGNING-INFO.txt)
          [[ "$expected_certificate" =~ ^[a-f0-9]{64}$ ]]
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "dist/$APK_NAME" > "$RUNNER_TEMP/hora-apk-verification.txt"
          grep -F "Signer #1 certificate SHA-256 digest: $expected_certificate" "$RUNNER_TEMP/hora-apk-verification.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "dist/$APK_NAME" > dist/APK-BADGING.txt
          grep -F "package: name='com.alphaexchange.offline'" dist/APK-BADGING.txt
          grep -F "versionName='${RELEASE_TAG#v}'" dist/APK-BADGING.txt
          expected_code=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('src/AlphaExchange.Android/AlphaExchange.Android.csproj').findtext('.//ApplicationVersion'))")
          grep -F "versionCode='$expected_code'" dist/APK-BADGING.txt
          cd dist
          sha256sum "$APK_NAME" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Keep verified signed APK for recovery
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-signed-release
          path: |
            dist/${{ env.APK_NAME }}
            dist/*.txt
          retention-days: 30
      - name: Publish and verify latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/hora-release-notes.md"
          cp "docs/RELEASE-${RELEASE_TAG}.md" "$notes"
          apk_hash=$(cut -d ' ' -f 1 dist/SHA256SUMS.txt)
          certificate=$(sed -n 's/^Certificate SHA-256: //p' dist/SIGNING-INFO.txt)
          printf '\nAPK: %s\n\nSHA-256: `%s`\n\n서명 인증서 SHA-256: `%s`\n\n빌드 소스: `%s` · Actions: %s\n' "$APK_NAME" "$apk_hash" "$certificate" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" >> "$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG · 기관 성장과 투자 판단 개선" --notes-file "$notes"
          fi
          while IFS= read -r asset; do
            if [[ "$asset" != "$APK_NAME" ]]; then gh release delete-asset "$RELEASE_TAG" "$asset" --yes; fi
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          gh release upload "$RELEASE_TAG" --clobber "dist/$APK_NAME"
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets|length')" = 1
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[0].name')" = "$APK_NAME"
          mkdir -p "$RUNNER_TEMP/hora-download"
          gh release download "$RELEASE_TAG" --pattern "$APK_NAME" --dir "$RUNNER_TEMP/hora-download"
          (cd "$RUNNER_TEMP/hora-download" && sha256sum --check "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt")
          gh release edit "$RELEASE_TAG" --notes-file "$notes" --draft=false --latest
