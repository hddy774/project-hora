name: Manually publish one Android game
on:
  workflow_dispatch:
    inputs:
      game:
        description: Registered game slug
        required: true
        default: alpha-exchange
        type: string
      tag:
        description: Existing registry-era game/vX.Y.0 tag (ALPHA EXCHANGE also accepts vX.Y.0)
        required: true
        type: string
      generate_signing_key:
        description: Generate a new one-time signing key (requires reinstall)
        required: true
        default: false
        type: boolean
      signed_run_id:
        description: Recover verified signed-release artifact from this run ID
        required: false
        default: ''
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ inputs.game }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      game: ${{ steps.source.outputs.game }}
      version: ${{ steps.source.outputs.version }}
      version_code: ${{ steps.source.outputs.version_code }}
      app_id: ${{ steps.source.outputs.app_id }}
      apk_name: ${{ steps.source.outputs.apk_name }}
      notes: ${{ steps.source.outputs.notes }}
      artifact_prefix: ${{ steps.source.outputs.artifact_prefix }}
      signing_script: ${{ steps.source.outputs.signing_script }}
      signing_secret_prefix: ${{ steps.source.outputs.signing_secret_prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve explicitly selected game and immutable merged tag
        id: source
        env:
          GAME: ${{ inputs.game }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/games.py resolve-release "$GAME" --tag "$REQUESTED_TAG" --github-output >> "$GITHUB_OUTPUT"
          # Feature releases use the minor version; never create or move tags here.
          [[ "$REQUESTED_TAG" =~ (^|/)v[0-9]+\.[0-9]+\.0$ ]]
          git merge-base --is-ancestor HEAD origin/main
          source=$(git rev-parse HEAD)
          test "$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")" = "$source"
          echo "sha=$source" >> "$GITHUB_OUTPUT"
  release:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GAME: ${{ needs.prepare.outputs.game }}
      GAME_VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      APP_ID: ${{ needs.prepare.outputs.app_id }}
      APK_NAME: ${{ needs.prepare.outputs.apk_name }}
      RELEASE_NOTES: ${{ needs.prepare.outputs.notes }}
      ARTIFACT_PREFIX: ${{ needs.prepare.outputs.artifact_prefix }}
      SIGNING_SCRIPT: ${{ needs.prepare.outputs.signing_script }}
      SIGNED_RUN_ID: ${{ inputs.signed_run_id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck selected game and merged source
        run: |
          if [[ -n "$SIGNED_RUN_ID" ]]; then [[ "$SIGNED_RUN_ID" =~ ^[0-9]+$ ]]; fi
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/games.py resolve-release "$GAME" --tag "$RELEASE_TAG"
      - uses: actions/setup-dotnet@v4
        if: ${{ !inputs.signed_run_id }}
        with:
          dotnet-version: '9.0.318'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Install Android workload
        if: ${{ !inputs.signed_run_id }}
        run: dotnet workload install android --skip-manifest-update
      - name: Verify simulation and artwork
        if: ${{ !inputs.signed_run_id }}
        run: |
          mkdir -p dist
          set -o pipefail
          python3 scripts/games.py check "$GAME" | tee dist/GAME-CHECKS.txt
      - name: Build APK from merged release tag
        if: ${{ !inputs.signed_run_id }}
        run: |
          python3 scripts/games.py build "$GAME"
          cp "dist/$GAME/$APP_ID.apk" dist/unsigned.apk
      - name: Keep unsigned build available for inspection
        if: ${{ !inputs.signed_run_id }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-build
          path: |
            dist/unsigned.apk
            dist/GAME-CHECKS.txt
          retention-days: 30
      - name: Sign APK with selected Android identity
        if: ${{ !inputs.signed_run_id }}
        env:
          GENERATE_SIGNING_KEY: ${{ inputs.generate_signing_key }}
          KEYSTORE_BASE64: ${{ secrets[format('{0}_KEYSTORE_BASE64', needs.prepare.outputs.signing_secret_prefix)] || (needs.prepare.outputs.game == 'alpha-exchange' && (secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64)) || '' }}
          STORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', needs.prepare.outputs.signing_secret_prefix)] || (needs.prepare.outputs.game == 'alpha-exchange' && (secrets.RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD)) || '' }}
          KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', needs.prepare.outputs.signing_secret_prefix)] || (needs.prepare.outputs.game == 'alpha-exchange' && (secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS)) || '' }}
          KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', needs.prepare.outputs.signing_secret_prefix)] || (needs.prepare.outputs.game == 'alpha-exchange' && (secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD)) || '' }}
        run: |
          bash "$SIGNING_SCRIPT" dist/unsigned.apk "dist/$APK_NAME" dist/SIGNING-INFO.txt
      - name: Recover previously verified signed APK
        if: ${{ inputs.signed_run_id }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-signed-release
          path: dist
          run-id: ${{ inputs.signed_run_id }}
          github-token: ${{ github.token }}
      - name: Verify APK identity and release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ -n "$SIGNED_RUN_ID" ]]; then
            (cd dist && sha256sum --check SHA256SUMS.txt)
            previous_workflow_commit=$(gh api "repos/$GH_REPO/actions/runs/$SIGNED_RUN_ID" --jq .head_sha)
            git merge-base --is-ancestor "$previous_workflow_commit" origin/main
            source_commit=$(git rev-parse HEAD)
            grep -Fx "Source commit: $source_commit" dist/SIGNING-INFO.txt
          fi
          expected_certificate=$(sed -n 's/^Certificate SHA-256: //p' dist/SIGNING-INFO.txt)
          [[ "$expected_certificate" =~ ^[a-f0-9]{64}$ ]]
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "dist/$APK_NAME" > "$RUNNER_TEMP/hora-apk-verification.txt"
          grep -F "Signer #1 certificate SHA-256 digest: $expected_certificate" "$RUNNER_TEMP/hora-apk-verification.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "dist/$APK_NAME" > dist/APK-BADGING.txt
          grep -F "package: name='$APP_ID'" dist/APK-BADGING.txt
          grep -F "versionName='$GAME_VERSION'" dist/APK-BADGING.txt
          grep -F "versionCode='$VERSION_CODE'" dist/APK-BADGING.txt
          cd dist
          sha256sum "$APK_NAME" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Keep verified signed APK for recovery
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-signed-release
          path: |
            dist/${{ env.APK_NAME }}
            dist/*.txt
          retention-days: 30
      - name: Publish and verify selected game release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/hora-release-notes.md"
          cp "$RELEASE_NOTES" "$notes"
          apk_hash=$(cut -d ' ' -f 1 dist/SHA256SUMS.txt)
          certificate=$(sed -n 's/^Certificate SHA-256: //p' dist/SIGNING-INFO.txt)
          printf '\nAPK: %s\n\nSHA-256: `%s`\n\n서명 인증서 SHA-256: `%s`\n\n빌드 소스: `%s` · Actions: %s\n' "$APK_NAME" "$apk_hash" "$certificate" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" >> "$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$GAME · v$GAME_VERSION" --notes-file "$notes"
          fi
          while IFS= read -r asset; do
            if [[ "$asset" != "$APK_NAME" ]]; then gh release delete-asset "$RELEASE_TAG" "$asset" --yes; fi
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          gh release upload "$RELEASE_TAG" --clobber "dist/$APK_NAME"
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets|length')" = 1
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[0].name')" = "$APK_NAME"
          mkdir -p "$RUNNER_TEMP/hora-download"
          gh release download "$RELEASE_TAG" --pattern "$APK_NAME" --dir "$RUNNER_TEMP/hora-download"
          (cd "$RUNNER_TEMP/hora-download" && sha256sum --check "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt")
          gh release edit "$RELEASE_TAG" --notes-file "$notes" --draft=false --latest=false
