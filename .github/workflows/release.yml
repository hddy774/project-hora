name: Verify identity or sign a private-build APK
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify retained identity, or sign an unsigned APK in an existing draft release
        type: choice
        options: [verify, stage, sign]
        default: verify
        required: true
      tag:
        description: Existing draft release tag
        type: string
        default: alpha-exchange/v1.12.0
        required: true
      unsigned_sha256:
        description: Reviewed unsigned APK SHA-256 (required for sign)
        type: string
        required: false
      source_archive_sha256:
        description: Private source archive SHA-256 (required for sign)
        type: string
        required: false
      artifact_commit:
        description: Reviewed temporary artifact-upload commit (required for stage)
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: alpha-exchange-distribution-signing
  cancel-in-progress: false
jobs:
  retained-key:
    if: ${{ github.repository == 'hddy774/project-hora' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/distribution') && github.actor == 'hddy774' && github.triggering_actor == 'hddy774' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPERATION: ${{ inputs.operation }}
      RELEASE_TAG: ${{ inputs.tag }}
      UNSIGNED_SHA256: ${{ inputs.unsigned_sha256 }}
      SOURCE_ARCHIVE_SHA256: ${{ inputs.source_archive_sha256 }}
      ARTIFACT_COMMIT: ${{ inputs.artifact_commit }}
    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          mode=os.environ['OPERATION']; tag=os.environ['RELEASE_TAG']
          assert mode in ('verify','stage','sign')
          match=re.fullmatch(r'alpha-exchange/v(1\.(\d+)\.0)',tag)
          assert match, 'Invalid release tag'
          if mode=='sign':
              assert all(re.fullmatch(r'[a-f0-9]{64}',os.environ[k]) for k in ('UNSIGNED_SHA256','SOURCE_ARCHIVE_SHA256')), 'Reviewed checksums required'
          if mode=='stage':
              assert re.fullmatch(r'[a-f0-9]{64}',os.environ['UNSIGNED_SHA256']), 'Reviewed binary checksum required'
              assert re.fullmatch(r'[a-f0-9]{40}',os.environ['ARTIFACT_COMMIT']), 'Immutable artifact commit required'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('GAME_VERSION='+match[1]+'\nVERSION_CODE='+str(int(match[2])+1)+'\nAPK_NAME=AlphaExchange-v'+match[1]+'.apk\n')
          PY
      - name: Stage reviewed unsigned binary through GitHub Actions
        if: ${{ inputs.operation == 'stage' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          mkdir -p "$RUNNER_TEMP/alpha-release"
          cd "$RUNNER_TEMP/alpha-release"
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GH_REPO/contents/UNSIGNED-$APK_NAME?ref=$ARTIFACT_COMMIT" > "UNSIGNED-$APK_NAME"
          python3 - <<'PY'
          import hashlib,os,pathlib
          p=pathlib.Path('UNSIGNED-'+os.environ['APK_NAME'])
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['UNSIGNED_SHA256'], 'Artifact checksum mismatch'
          PY
          gh release upload "$RELEASE_TAG" "UNSIGNED-$APK_NAME" --clobber
          mkdir downloaded
          gh release download "$RELEASE_TAG" --pattern "UNSIGNED-$APK_NAME" --dir downloaded
          cmp "UNSIGNED-$APK_NAME" "downloaded/UNSIGNED-$APK_NAME"
      - name: Fetch reviewed binary from draft release
        if: ${{ inputs.operation == 'sign' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          mkdir -p "$RUNNER_TEMP/alpha-release"
          gh release download "$RELEASE_TAG" --pattern "UNSIGNED-$APK_NAME" --dir "$RUNNER_TEMP/alpha-release"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$sdk_root/build-tools/35.0.0/apksigner" ] || [ ! -x "$sdk_root/build-tools/35.0.0/aapt" ]; then
            sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            test -x "$sdk_manager"
            "$sdk_manager" --sdk_root="$sdk_root" 'build-tools;35.0.0' >/dev/null
          fi
          printf 'ANDROID_HOME=%s\n' "$sdk_root" >> "$GITHUB_ENV"
      - name: Verify retained private key and sign only the reviewed binary
        if: ${{ inputs.operation != 'stage' }}
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,re,subprocess,sys,tempfile,zipfile
          PIN='0832f24441f1caf335166fbc16ae0b9536e262ca48f258926a8027fc31dca25a'
          def mask(s):
              print('::add-mask::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'),flush=True)
          def unique(pairs):
              result={}
              for k,v in pairs:
                  if k in result: raise ValueError('duplicate')
                  result[k]=v
              return result
          def quiet(args,env):
              result=subprocess.run(args,env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if result.returncode: raise ValueError('command failed')
              return result.stdout
          def format_kind(value):
              value=value.strip().lstrip('\ufeff').strip()
              if not value: return 'empty'
              if value.startswith('```'): return 'Markdown fenced text'
              if value.startswith('{'): return 'JSON object text'
              if value.startswith('"'): return 'JSON string text'
              if value.startswith("'"): return 'single-quoted text'
              if re.fullmatch(r'[^\r\n{}]{1,512}\.(?:json|zip|p12|jks)',value,re.I): return 'file name or path text'
              if value.startswith(('http://','https://')): return 'URL text'
              try:
                  decoded=base64.b64decode(''.join(value.split()),validate=True)
              except Exception:
                  return 'unrecognized non-JSON text (not valid base64)'
              if decoded.startswith(b'PK\x03\x04'): return 'base64-encoded ZIP archive'
              if decoded.startswith(b'\x30\x82'): return 'base64-encoded ASN.1 binary (possible key container)'
              if decoded.startswith((b'\xff\xfe',b'\xfe\xff')): return 'base64-encoded UTF-16 text'
              try:
                  text=decoded.decode('utf-8-sig').strip()
              except Exception:
                  return 'base64-encoded non-UTF-8 binary'
              return 'base64-encoded JSON text' if text.startswith(('{','"')) else 'base64-encoded non-JSON text'
          phase='bundle availability and size'
          try:
              raw=os.environ.get('SIGNING_BUNDLE','')
              if not raw or len(raw.encode())>48000: raise ValueError('missing bundle')
              phase='bundle JSON parsing'
              mask(raw)
              payload=raw.strip().lstrip('\ufeff').strip()
              fence=re.fullmatch(r'```(?:json)?[ \t]*\r?\n(.*)\r?\n```',payload,re.I|re.S)
              if fence:
                  payload=fence[1].strip()
              if payload.startswith("'{") and payload.endswith("}'"):
                  payload=payload[1:-1]
              if not payload.startswith(('{','"')):
                  phase='bundle transport base64 decoding'
                  decoded=base64.b64decode(''.join(payload.split()),validate=True)
                  phase='bundle transport UTF-8 decoding'
                  payload=decoded.decode('utf-8-sig').strip()
              phase='bundle JSON parsing'
              b=json.loads(payload,object_pairs_hook=unique)
              if isinstance(b,str):
                  b=json.loads(b.strip().lstrip('\ufeff').strip(),object_pairs_hook=unique)
              phase='bundle field names and schema version'
              fields={'schemaVersion','game','applicationId','keystoreBase64','storePassword','keyAlias','keyPassword','certificateSha256'}
              if not isinstance(b,dict) or set(b)!=fields or type(b['schemaVersion']) is not int or b['schemaVersion']!=1: raise ValueError('schema')
              phase='bundle application identity'
              if b['game']!='alpha-exchange' or b['applicationId']!='com.alphaexchange.offline': raise ValueError('identity')
              phase='bundle certificate fingerprint'
              if b['certificateSha256']!=PIN: raise ValueError('identity')
              phase='bundle key and password field validation'
              for key in ('keystoreBase64','storePassword','keyAlias','keyPassword'):
                  value=b[key]
                  if not isinstance(value,str) or not 1<=len(value)<=44000 or '\x00' in value: raise ValueError('field')
                  mask(value)
              phase='keystore base64 decoding and size'
              data=base64.b64decode(''.join(b['keystoreBase64'].split()),validate=True)
              if not 1<=len(data)<=32768: raise ValueError('size')
              os.umask(0o077)
              env={k:v for k,v in os.environ.items() if k not in ('SIGNING_BUNDLE','GITHUB_TOKEN','GH_TOKEN')}
              env.update(STORE_PASSWORD=b['storePassword'],KEY_PASSWORD=b['keyPassword'])
              phase='temporary key preparation'
              with tempfile.TemporaryDirectory(prefix='alpha-key-',dir=os.environ['RUNNER_TEMP']) as tmp:
                  key=pathlib.Path(tmp)/'identity.p12'; cert=pathlib.Path(tmp)/'certificate.der'; key.write_bytes(data)
                  phase='keystore certificate export (format, alias and store password)'
                  quiet(['keytool','-exportcert','-keystore',str(key),'-alias',b['keyAlias'],'-storepass:env','STORE_PASSWORD','-file',str(cert)],env)
                  phase='exported certificate fingerprint'
                  if hashlib.sha256(cert.read_bytes()).hexdigest()!=PIN: raise ValueError('pin')
                  phase='private key access (alias and key password)'
                  quiet(['keytool','-certreq','-keystore',str(key),'-alias',b['keyAlias'],'-storepass:env','STORE_PASSWORD','-keypass:env','KEY_PASSWORD'],env)
                  if os.environ['OPERATION']=='sign':
                      phase='unsigned APK checksum'
                      root=pathlib.Path(os.environ['RUNNER_TEMP'])/'alpha-release'
                      apk=root/('UNSIGNED-'+os.environ['APK_NAME']); signed=root/os.environ['APK_NAME']
                      if hashlib.sha256(apk.read_bytes()).hexdigest()!=os.environ['UNSIGNED_SHA256']: raise ValueError('input checksum')
                      sdk=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
                      phase='Android APK manifest and permissions'
                      badging=quiet([str(sdk/'aapt'),'dump','badging',str(apk)],env).decode()
                      for expected in ("package: name='com.alphaexchange.offline'","versionName='"+os.environ['GAME_VERSION']+"'","versionCode='"+os.environ['VERSION_CODE']+"'","sdkVersion:'26'"):
                          if expected not in badging: raise ValueError('manifest')
                      if 'android.permission.INTERNET' in quiet([str(sdk/'aapt'),'dump','permissions',str(apk)],env).decode(): raise ValueError('network permission')
                      phase='Android APK ABIs'
                      with zipfile.ZipFile(apk) as z:
                          if {n.split('/')[1] for n in z.namelist() if n.startswith('lib/')}!={'arm64-v8a','x86_64'}: raise ValueError('abi')
                      phase='APK signing'
                      quiet([str(sdk/'apksigner'),'sign','--ks',str(key),'--ks-key-alias',b['keyAlias'],'--ks-pass','env:STORE_PASSWORD','--key-pass','env:KEY_PASSWORD','--out',str(signed),str(apk)],env)
                      phase='signed APK verification'
                      verification=quiet([str(sdk/'apksigner'),'verify','--verbose','--print-certs',str(signed)],env).decode()
                      signers=[line for line in verification.splitlines() if re.fullmatch(r'Signer #[0-9]+ certificate SHA-256 digest: .*',line)]
                      if signers!=['Signer #1 certificate SHA-256 digest: '+PIN]: raise ValueError('signer')
                      phase='public verification report generation'
                      (root/'SHA256SUMS.txt').write_text(hashlib.sha256(signed.read_bytes()).hexdigest()+'  '+signed.name+'\n')
                      info={'applicationId':'com.alphaexchange.offline','version':os.environ['GAME_VERSION'],'versionCode':int(os.environ['VERSION_CODE']),'certificateSha256':PIN,'unsignedApkSha256':os.environ['UNSIGNED_SHA256'],'privateSourceArchiveSha256':os.environ['SOURCE_ARCHIVE_SHA256'],'workflowRun':os.environ['GITHUB_RUN_ID'],'workflowCommit':os.environ['GITHUB_SHA']}
                      (root/'APK-VERIFICATION.json').write_text(json.dumps(info,indent=2)+'\n')
              print('Retained signing identity verified: '+PIN)
          except Exception:
              print('::notice::Signing input format: '+format_kind(os.environ.get('SIGNING_BUNDLE','')),file=sys.stderr)
              print('::error::Retained identity or binary validation failed at: '+phase+'. Check the original ANDROID_SIGNING_BUNDLE and reviewed checksums. No secret values are reported; no new key was generated.',file=sys.stderr)
              sys.exit(1)
          PY
      - name: Attach verified signed binary to the draft for final validation
        if: ${{ inputs.operation == 'sign' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          cd "$RUNNER_TEMP/alpha-release"
          gh release upload "$RELEASE_TAG" "$APK_NAME" SHA256SUMS.txt APK-VERIFICATION.json --clobber
          mkdir downloaded
          gh release download "$RELEASE_TAG" --pattern "$APK_NAME" --dir downloaded
          (cd downloaded && sha256sum --check ../SHA256SUMS.txt)
