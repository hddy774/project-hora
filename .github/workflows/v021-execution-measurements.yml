name: 0.2.1 실행 비교 실측 수집

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 측정할 저장소 소스의 정확한 소문자 40자리 커밋 SHA
        type: string
        required: true
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: v021-execution-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_MULTILEVEL_LOOKUP: '0'
  V021_THERMAL_STATE: GitHub 호스트 VM·실제 호스트 열 상태 미측정
  V021_POWER_STATE: GitHub 호스트 VM·실제 호스트 전력·전원 상태 미측정

jobs:
  measure:
    name: ${{ matrix.experiment }} · 고정 소스 실행 비교
    if: >-
      ${{ github.repository == 'hddy774/project-hora' &&
          github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
            github.event.label.name == '0.2.1 최종 실측 실행' &&
            github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        experiment: [EX-01, EX-02, EX-03, EX-04, EX-05, EX-06]
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha }}
      EXPERIMENT: ${{ matrix.experiment }}
      WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: 요청 원본 보존·정확한 소스 입력 검증
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          root = temp / f"v021-execution-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-{os.environ['EXPERIMENT']}"
          root.mkdir(parents=True, exist_ok=False)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('RESULT_DIR=' + str(root) + '\n')
              out.write('DOTNET_INSTALL_DIR=' + str(temp / 'v021-execution-dotnet') + '\n')
              out.write('DOTNET_ROOT=' + str(temp / 'v021-execution-dotnet') + '\n')
              out.write('DOTNET_CLI_HOME=' + str(temp / 'v021-execution-dotnet-home') + '\n')
          data = {key: os.environ.get(key) for key in [
              'SOURCE_SHA', 'EXPERIMENT', 'WORKFLOW_SOURCE_SHA',
              'GITHUB_EVENT_NAME', 'GITHUB_REPOSITORY', 'GITHUB_WORKFLOW_REF',
              'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_ACTOR',
              'GITHUB_TRIGGERING_ACTOR', 'REPOSITORY_PRIVATE']}
          (root / 'request.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          if re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE_SHA']) is None:
              raise SystemExit('브랜치/태그/축약 ref 대신 정확한 소문자 SHA40을 지정해야 합니다.')
          if os.environ['REPOSITORY_PRIVATE'] != 'false':
              raise SystemExit('이 수집 경로는 확인한 public 저장소의 표준 러너 사양만 대상으로 합니다.')
          PY

      - name: 이벤트에 고정된 실제 소스 가져오기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hddy774/project-hora
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: 격리된 동일 개발 도구 설정(.NET SDK 10.0.403)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'

      - name: 소스 지문·실제 러너 CPU/메모리·실행 환경 보존
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, shutil, subprocess
          root = pathlib.Path(os.environ['RESULT_DIR'])
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          def optional(path):
              p = pathlib.Path(path)
              return p.read_text().strip() if p.is_file() else None
          sha = run('git', 'rev-parse', 'HEAD')
          if sha != os.environ['SOURCE_SHA'] or run('git', 'status', '--porcelain', '--untracked-files=all'):
              raise SystemExit('실제 HEAD와 입력 SHA가 다르거나 소스가 깨끗하지 않습니다.')
          sdk = run('dotnet', '--version')
          (root / 'dotnet-info.txt').write_text(run('dotnet', '--info') + '\n')
          if sdk != '10.0.403':
              raise SystemExit(f'실제 SDK {sdk}가 요청한 10.0.403과 다릅니다. 다른 SDK로 대체하지 않습니다.')
          fingerprint = run('python3', 'scripts/verify-v021-release.py', 'fingerprint', '--commit', sha)
          if len(fingerprint) != 64 or any(c not in '0123456789abcdef' for c in fingerprint):
              raise SystemExit('실제 제품 SHA256 지문을 확인하지 못했습니다.')
          version = pathlib.Path('VERSION').read_text().strip()
          if version != '0.2.1':
              raise SystemExit('이번 수집 대상 VERSION은 0.2.1입니다.')
          meminfo = {a: b.strip() for a, b in (line.split(':', 1) for line in pathlib.Path('/proc/meminfo').read_text().splitlines())}
          cpu = next((line.split(':', 1)[1].strip() for line in pathlib.Path('/proc/cpuinfo').read_text().splitlines() if line.startswith('model name')), '미상')
          data = {
              'source_commit': sha, 'product_source_fingerprint': fingerprint, 'version': version,
              'workflow_source_commit': os.environ['WORKFLOW_SOURCE_SHA'], 'sdk': sdk,
              'dotnet_info': run('dotnet', '--info'), 'os': platform.platform(), 'uname': list(platform.uname()),
              'runner_name': os.environ.get('RUNNER_NAME'), 'runner_os': os.environ.get('RUNNER_OS'),
              'runner_arch': os.environ.get('RUNNER_ARCH'), 'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'), 'cpu_model': cpu,
              'os_cpu_count': os.cpu_count(), 'affinity_cpu_count': len(os.sched_getaffinity(0)),
              'meminfo': meminfo, 'disk_bytes': dict(shutil.disk_usage(root)._asdict()),
              'cgroup_cpu_max': optional('/sys/fs/cgroup/cpu.max'),
              'cgroup_memory_max': optional('/sys/fs/cgroup/memory.max'),
              'thermal_scope': os.environ['V021_THERMAL_STATE'], 'power_scope': os.environ['V021_POWER_STATE'],
              'runner_class': 'public ubuntu-24.04·공식 표준 4vCPU/16GB·실제 값은 이 기록을 따름',
              'cross_matrix_limit': '여섯 job은 같은 러너 종류/SDK를 쓰는 서로 다른 VM이다. 같은 물리 CPU·열·전원을 보장하지 않음',
              'measurement_scope': '각 job 안에서 같은 초기 입력의 baseline/candidate를 비교. PC 결과이며 Android/Unity 수용 근거가 아님'}
          (root / 'source-environment.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('PRODUCT_FINGERPRINT=' + fingerprint + '\n')
              out.write('PRODUCT_VERSION=' + version + '\n')
          PY

      - name: 고정 소스 Release 네 assembly 빌드
        shell: bash
        run: |
          set -o pipefail
          dotnet build tests/Chronicles.Game.Tests -c Release --artifacts-path "$RESULT_DIR/build" \
            -p:ContinuousIntegrationBuild=true -p:SourceRevisionId="$SOURCE_SHA" \
            -p:IncludeSourceRevisionInInformationalVersion=true 2>&1 | tee "$RESULT_DIR/build.log"
          git status --porcelain --untracked-files=all > "$RESULT_DIR/git-after-build.txt"
          test ! -s "$RESULT_DIR/git-after-build.txt"
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['RESULT_DIR']).resolve()
          files = list((root / 'build' / 'bin').rglob('Chronicles.Game.Tests.dll'))
          if len(files) != 1 or not files[0].resolve().is_relative_to(root):
              raise SystemExit('checkout 밖의 유일한 실제 Tests DLL을 찾지 못했습니다.')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('TEST_DLL=' + str(files[0]) + '\n')
              out.write('TEST_DLL_DIR=' + str(files[0].parent) + '\n')
          PY

      - name: 실제 네 DLL의 소스 revision·PE 정보·SHA256 검증
        shell: bash
        run: |
          inspector="$RUNNER_TEMP/v021-dll-inspector-$EXPERIMENT"
          mkdir -p "$inspector" "$RESULT_DIR/assemblies"
          cat > "$inspector/Inspector.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup></Project>
          XML
          cat > "$inspector/Program.cs" <<'CS'
          using System.Reflection.Metadata;
          using System.Reflection.PortableExecutable;
          using System.Runtime.InteropServices;
          using System.Security.Cryptography;
          using System.Text.Json;
          var folder = Path.GetFullPath(args[0]); var sha = args[1]; var version = args[2]; var output = args[3];
          var rows = new List<object>();
          foreach (var name in new[] { "Chronicles.Core", "Chronicles.Game", "Chronicles.Hosting", "Chronicles.Game.Tests" })
          {
              var path = Path.Combine(folder, name + ".dll");
              using var stream = File.OpenRead(path); using var pe = new PEReader(stream);
              var metadata = pe.GetMetadataReader(); var definition = metadata.GetAssemblyDefinition(); string? information = null, configuration = null;
              foreach (var handle in definition.GetCustomAttributes())
              {
                  var attribute = metadata.GetCustomAttribute(handle);
                  EntityHandle parent = attribute.Constructor.Kind switch
                  {
                      HandleKind.MemberReference => metadata.GetMemberReference((MemberReferenceHandle)attribute.Constructor).Parent,
                      HandleKind.MethodDefinition => metadata.GetMethodDefinition((MethodDefinitionHandle)attribute.Constructor).GetDeclaringType(),
                      _ => default
                  };
                  if (parent.Kind != HandleKind.TypeReference) continue;
                  var type = metadata.GetTypeReference((TypeReferenceHandle)parent);
                  if (metadata.GetString(type.Namespace) != "System.Reflection") continue;
                  var attributeName = metadata.GetString(type.Name);
                  if (attributeName is not ("AssemblyInformationalVersionAttribute" or "AssemblyConfigurationAttribute")) continue;
                  var value = metadata.GetBlobReader(attribute.Value);
                  if (value.ReadUInt16() != 1) throw new InvalidDataException("잘못된 assembly 정보 형식");
                  if (attributeName == "AssemblyInformationalVersionAttribute") information = value.ReadSerializedString();
                  else configuration = value.ReadSerializedString();
              }
              if (metadata.GetString(definition.Name) != name || information != version + "+" + sha || configuration != "Release")
                  throw new InvalidDataException(name + " 실제 DLL의 소스 revision이 고정 소스와 다릅니다: " + information);
              rows.Add(new { name, version = definition.Version.ToString(), informationalVersion = information, configuration,
                  bytes = new FileInfo(path).Length, sha256 = Convert.ToHexStringLower(SHA256.HashData(File.ReadAllBytes(path))) });
          }
          File.WriteAllText(output, JsonSerializer.Serialize(new { source_commit = sha, runtime = RuntimeInformation.FrameworkDescription,
              cpu_count = Environment.ProcessorCount, os = RuntimeInformation.OSDescription, assemblies = rows }, new JsonSerializerOptions { WriteIndented = true }));
          if (RuntimeInformation.FrameworkDescription != ".NET 10.0.14")
              throw new InvalidOperationException("실제 runtime이 기준선의 .NET 10.0.14와 다릅니다: " + RuntimeInformation.FrameworkDescription);
          CS
          set -o pipefail
          dotnet run --project "$inspector/Inspector.csproj" -c Release -- \
            "$TEST_DLL_DIR" "$SOURCE_SHA" "$PRODUCT_VERSION" \
            "$RESULT_DIR/assembly-evidence.json" 2>&1 | tee "$RESULT_DIR/assembly-inspector.log"
          for name in Chronicles.Core Chronicles.Game Chronicles.Hosting Chronicles.Game.Tests; do
            cp "$TEST_DLL_DIR/$name.dll" "$RESULT_DIR/assemblies/"
          done

      - name: 기존 CLI의 실제 범위별 예열·측정 실행
        id: measure
        shell: bash
        run: |
          case "$EXPERIMENT" in
            EX-01|EX-02|EX-04)
              arguments=(--filter INV-001/002/011 --report "$RESULT_DIR/preceding-functional.json"
                --execution-experiment "$EXPERIMENT" --execution-output "$RESULT_DIR/raw-measurements.json"
                --execution-populations 2,100,1000,10000 --execution-repetitions 1)
              ;;
            EX-03|EX-05|EX-06)
              arguments=(--filter INV-001/002/011 --report "$RESULT_DIR/preceding-functional.json"
                --execution-experiment "$EXPERIMENT" --execution-output "$RESULT_DIR/raw-measurements.json"
                --execution-source-fingerprint "$PRODUCT_FINGERPRINT" --execution-listings 32
                --execution-repetitions 25 --execution-warmups 2 --execution-workspace "$RESULT_DIR/io")
              ;;
            *) exit 2 ;;
          esac
          # job 120분 안에 항상 업로드할 여유를 남긴다. 시간 초과는 exit124로 실패 보존한다.
          set +e
          /usr/bin/time -v -o "$RESULT_DIR/process-resource.txt" timeout --signal=TERM --kill-after=30s 100m \
            dotnet "$TEST_DLL" \
            "${arguments[@]}" \
            2>&1 | tee "$RESULT_DIR/measurement.log"
          statuses=("${PIPESTATUS[@]}")
          python3 - "$RESULT_DIR" "${statuses[0]}" "${statuses[1]}" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1], 'process-exit.json').write_text(json.dumps({
              'measurement_exit': int(sys.argv[2]), 'log_exit': int(sys.argv[3]),
              'timeout_exit_is_failure': True, 'completed_rows_only': '기존 CLI는 완료된 규모/반복 단위로 저장하며 중단한 현재 variant의 진행 중 raw까지 보장하지 않음'}, ensure_ascii=False, indent=2) + '\n')
          PY
          if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"

      - name: 실제 완료·소스·입력·원시 표본의 수집 정합 검증
        id: verify_collection
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['RESULT_DIR'])
          report = json.loads((root / 'raw-measurements.json').read_text())
          precheck = json.loads((root / 'preceding-functional.json').read_text())
          assert precheck['failed'] == 0 and precheck['total'] > 0
          assert len(precheck['results']) == precheck['total'] and all(row['passed'] is True for row in precheck['results'])
          experiment = os.environ['EXPERIMENT']; fingerprint = os.environ['PRODUCT_FINGERPRINT']
          if experiment in ['EX-01', 'EX-02', 'EX-04']:
              assert report['failure'] is None and report['complete'] is True and report['requested_complete'] is True
              assert report['requested_experiments'] == [experiment]
              assert report['requested_populations'] == [2, 100, 1000, 10000] and report['repetitions'] == 1
              assert report['host']['Commit'] == os.environ['SOURCE_SHA']
              assert report['host']['ProductSourceFingerprint'] == fingerprint
              rows = report['rows']; assert rows
              for row in rows:
                  measured = row['Measurement']; raw = measured['RawSamples']
                  assert measured['ProductSourceFingerprint'] == fingerprint
                  assert measured['WarmupOpeningHash'] == measured['MeasuredOpeningHash']
                  assert raw and len(raw) == len(row['Allocations']) == len(row['OperationLabels'])
                  assert all(sample['Nanoseconds'] >= 0 for sample in raw)
                  assert all(sample['CurrentThreadBytes'] >= 0 for sample in row['Allocations'])
              actual = {(row['Population'], row['Repetition']) for row in rows if row['Variant'].endswith(':actual-assess') or experiment != 'EX-04'}
              assert actual == {(population, 0) for population in [2, 100, 1000, 10000]}
              if experiment in ['EX-01', 'EX-02']:
                  assert len(rows) == 8
                  for population in [2, 100, 1000, 10000]:
                      pair = [row for row in rows if row['Population'] == population]
                      assert {row['Variant'] for row in pair} == {'original-person-array', 'hot-columns-due-heap'}
                      assert pair[0]['Boundaries'] == pair[1]['Boundaries'] and pair[0]['OutputDigest'] == pair[1]['OutputDigest']
              else:
                  backends = {'canonical-csharp-scalar-v1', 'catalog-csharp-vector-int32-v1', 'partial-output-discard-and-scalar', 'unsupported-and-scalar'}
                  for population in [2, 100, 1000, 10000]:
                      group = [row for row in rows if row['Population'] == population and row['Variant'].endswith(':actual-assess')]
                      assert {row['Variant'] for row in group} == {name + ':actual-assess' for name in backends}
                      assert len({row['OutputDigest'] for row in group}) == 1
                  direct = [row for row in rows if row['Variant'].endswith(':direct-kernel')]
                  assert direct
                  width = int(re.search(r'Vector<int>.Count=(\d+)', direct[0]['Measurement']['SupportedFeatures']).group(1))
                  for count in {0, 1, width - 1, width, width + 1, 24, 2400}:
                      group = [row for row in direct if row['Measurement']['BatchLength'] == count]
                      assert {row['Variant'] for row in group} == {name + ':direct-kernel' for name in backends}
                      assert len({row['OutputDigest'] for row in group}) == 1
              scope = '네 인구 규모의 실제 세계/자질 비교; 기본 반복1·소량 표본 한계 유지'
          else:
              assert report['SourceFingerprint'] == fingerprint
              options = report['Options']
              assert options['ProductSourceFingerprint'] == fingerprint and options['Listings'] == 32
              assert options['Repetitions'] == 25 and options['Warmups'] == 2
              assert pathlib.Path(options['Workspace']).resolve() == (root / 'io').resolve()
              assert report['WarmupPreparation']['OutputHash'] == report['MeasuredPreparation']['OutputHash']
              comparisons = report['Comparisons']; assert len(comparisons) == 1 and comparisons[0]['Id'] == experiment
              rows = comparisons[0]['Variants']; assert rows
              for row in rows:
                  measured = row['Measurement']; raw = row['RawSamples']
                  assert measured['ProductSourceFingerprint'] == fingerprint
                  assert measured['WarmupOpeningHash'] == measured['MeasuredOpeningHash']
                  assert len(raw) == len(measured['RawSamples']) == 25
                  assert all(sample['Nanoseconds'] >= 0 and sample['ManagedAllocatedBytes'] >= 0 and sample['MatchesReference'] is True for sample in raw)
              scope = '실제 두 인물·32개 공개 출품/권한 입력·반복25·예열2; 대량 인구 실행을 주장하지 않음'
          assemblies = json.loads((root / 'assembly-evidence.json').read_text())
          assert assemblies['source_commit'] == os.environ['SOURCE_SHA'] and len(assemblies['assemblies']) == 4
          for assembly in assemblies['assemblies']:
              for folder in [pathlib.Path(os.environ['TEST_DLL_DIR']), root / 'assemblies']:
                  assert hashlib.sha256((folder / (assembly['name'] + '.dll')).read_bytes()).hexdigest() == assembly['sha256']
          if subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True).strip():
              raise SystemExit('측정 중 소스가 바뀌었습니다.')
          validation = {'collection_validated': True, 'source_commit': os.environ['SOURCE_SHA'],
              'product_source_fingerprint': os.environ['PRODUCT_FINGERPRINT'], 'experiment': os.environ['EXPERIMENT'],
              'rows': len(rows), 'adoption': 'revisit', 'scope': scope,
              'preceding_functional_total': precheck['total'],
              'full_functional_scope': '이 job은 선택 창세 검사만 수행한다. 같은 제품 지문의 전체 기능 근거는 별도 총괄 보고서/제품 CI를 따른다.',
              'meaning': '수집 정합만 확인. H06/H09·릴리스·Android·전략 채택 수용을 자동 선언하지 않음',
              'files_sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}}
          (root / 'collection-validation.json').write_text(json.dumps(validation, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: 실행 요약·원본 파일 SHA256 보존
        if: always()
        env:
          COLLECTION_OUTCOME: ${{ steps.verify_collection.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RESULT_DIR'])
          if not root.exists(): raise SystemExit('요청 원본 폴더가 없습니다.')
          paths = [p for p in root.rglob('*') if p.is_file()]
          (root / 'artifact-sha256.json').write_text(json.dumps({str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}, indent=2) + '\n')
          valid = os.environ['COLLECTION_OUTCOME'] == 'success' and (root / 'collection-validation.json').exists()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"실험 {os.environ['EXPERIMENT']} · 소스 {os.environ['SOURCE_SHA']}\n\n")
              out.write(f"수집 정합 완료 기록: {valid}. 원본 실패·partial·로그도 같은 산출물에 보존합니다.\n\n")
              out.write('각 matrix는 서로 다른 public ubuntu-24.04 VM입니다. 실제 CPU/메모리/런타임은 source-environment와 assembly-evidence를 따릅니다. 실제 호스트 열·전원은 미측정이며 PC 결과를 Android/Unity로 확장하지 않습니다.\n\n')
              out.write('EX01/02/04는 네 인구 규모·반복1, EX03/05/06은 실제 두 인물·32출품/권한 입력·반복25·예열2입니다. 원시 n과 p95/p99 한계를 유지하며 자동 adopt/pass를 만들지 않습니다.\n')
          PY

      - name: 성공·실패·부분 원본 업로드(14일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v021-execution-${{ matrix.experiment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v021-execution-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.experiment }}/
          if-no-files-found: error
          retention-days: 14
