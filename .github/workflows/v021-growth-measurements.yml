name: 0.2.1 원형 성장 9조건 실측

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 측정할 정확한 소문자 40자리 소스 SHA
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: v021-growth-${{ github.run_id }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_MULTILEVEL_LOOKUP: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  V021_THERMAL_STATE: GitHub 호스트 VM·물리 호스트의 열 상태 미측정
  V021_POWER_STATE: GitHub 호스트 VM·물리 호스트의 전력·전원 상태 미측정

jobs:
  growth:
    name: 성장 ${{ matrix.scenario }} · 시드 ${{ matrix.seed }} · 6000개월
    if: >-
      ${{ github.repository == 'hddy774/project-hora' &&
          github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner &&
          ((github.event_name == 'pull_request' && github.event.action == 'labeled' &&
            github.event.label.name == '0.2.1 성장 실측 실행' &&
            github.event.pull_request.head.repo.full_name == github.repository) ||
           (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        scenario: [a, b, c]
        seed: [42, 98, 2026]
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha }}
      SCENARIO: ${{ matrix.scenario }}
      SEED: ${{ matrix.seed }}
      WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: 라벨 요청 원본과 체크아웃 밖 경로 준비
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          root = temp / f"v021-growth-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-{os.environ['SCENARIO']}-{os.environ['SEED']}"
          assert not root.is_relative_to(pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve())
          root.mkdir(parents=True, exist_ok=False)
          for name in ['out', 'logs', 'environment', 'provenance', 'tools', 'build', 'tmp', 'dotnet', 'dotnet-home', 'nuget']:
              (root / name).mkdir()
          values = {'RESULT_DIR': root, 'DOTNET_INSTALL_DIR': root / 'dotnet', 'DOTNET_ROOT': root / 'dotnet',
                    'DOTNET_CLI_HOME': root / 'dotnet-home', 'NUGET_PACKAGES': root / 'nuget',
                    'TMPDIR': root / 'tmp', 'TMP': root / 'tmp', 'TEMP': root / 'tmp'}
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.writelines(str(key) + '=' + str(value) + '\n' for key, value in values.items())
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE_SHA']), '정확한 소문자 SHA40만 허용합니다'
          request = {key: os.environ.get(key) for key in ['SOURCE_SHA', 'SCENARIO', 'SEED', 'WORKFLOW_SOURCE_SHA',
                     'GITHUB_EVENT_NAME', 'GITHUB_REPOSITORY', 'GITHUB_WORKFLOW_REF', 'GITHUB_RUN_ID',
                     'GITHUB_RUN_ATTEMPT', 'GITHUB_ACTOR', 'GITHUB_TRIGGERING_ACTOR', 'REPOSITORY_PRIVATE']}
          (root / 'provenance/request.json').write_text(json.dumps(request, ensure_ascii=False, indent=2) + '\n')
          assert os.environ['REPOSITORY_PRIVATE'] == 'false', '공개 저장소의 표준 러너가 필요합니다'
          PY
      - name: 이벤트에 고정한 소스 SHA 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hddy774/project-hora
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: 격리된 SDK 10.0.403 설치
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: 소스·실제 CPU·메모리·쿼터·디스크·런타임 기록
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, shutil, subprocess
          root = pathlib.Path(os.environ['RESULT_DIR'])
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          def optional(path):
              p = pathlib.Path(path)
              return p.read_text().strip() if p.is_file() else None
          sha = run('git', 'rev-parse', 'HEAD')
          assert sha == os.environ['SOURCE_SHA'] and not run('git', 'status', '--porcelain', '--untracked-files=all'), '고정 SHA·깨끗한 소스가 아닙니다'
          sdk = run('dotnet', '--version')
          assert sdk == '10.0.403', '요청 SDK 설치에 실패했습니다. 다른 버전으로 대체하지 않습니다'
          fingerprint = run('python3', 'scripts/verify-v021-release.py', 'fingerprint', '--commit', sha)
          assert len(fingerprint) == 64 and all(c in '0123456789abcdef' for c in fingerprint)
          version = pathlib.Path('VERSION').read_text().strip()
          assert version == '0.2.1'
          cpuinfo = pathlib.Path('/proc/cpuinfo').read_text()
          meminfo = pathlib.Path('/proc/meminfo').read_text()
          cgroup_names = ['cpu.max', 'cpuset.cpus.effective', 'memory.max', 'memory.current', 'memory.peak', 'memory.events', 'memory.swap.max']
          environment = {'os': platform.platform(), 'uname': list(platform.uname()), 'runner_name': os.environ.get('RUNNER_NAME'),
              'runner_os': os.environ.get('RUNNER_OS'), 'runner_arch': os.environ.get('RUNNER_ARCH'),
              'runner_environment': os.environ.get('RUNNER_ENVIRONMENT'), 'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'), 'os_cpu_count': os.cpu_count(),
              'affinity_cpus': sorted(os.sched_getaffinity(0)),
              'cpu_model': next((line.split(':', 1)[1].strip() for line in cpuinfo.splitlines() if line.startswith('model name')), None),
              'meminfo': meminfo, 'disk_bytes': dict(shutil.disk_usage(root)._asdict()),
              'cgroup': {name: optional('/sys/fs/cgroup/' + name) for name in cgroup_names},
              'sdk': sdk, 'dotnet_info': run('dotnet', '--info'), 'runtimes': run('dotnet', '--list-runtimes'),
              'thermal_state': os.environ['V021_THERMAL_STATE'], 'power_state': os.environ['V021_POWER_STATE'],
              'nominal_runner': 'GitHub 공개 ubuntu-24.04 표준 4vCPU/16GB; 실제 값은 이 원본을 따름',
              'cross_vm_limit': '9개 독립 VM의 CPU 모델·쿼터·메모리·디스크·열·전원 동일성을 보장하지 않음. 실행시간은 동일 머신의 paired 비교가 아님',
              'scope': '원형 성장 관측. Android/기기 성능·실제 플레이 배속·인구 균형의 보편적 증명이 아님'}
          (root / 'environment/before.json').write_text(json.dumps(environment, ensure_ascii=False, indent=2) + '\n')
          (root / 'environment/cpuinfo.txt').write_text(cpuinfo)
          assert environment['runner_environment'] == 'github-hosted', 'GitHub 공개 호스트 러너가 아닙니다'
          source = {'source_commit': sha, 'source_tree': run('git', 'rev-parse', 'HEAD^{tree}'),
                    'product_source_fingerprint': fingerprint, 'version': version, 'source_worktree_clean': True,
                    'workflow_source_commit': os.environ['WORKFLOW_SOURCE_SHA'], 'sdk': sdk,
                    'scenario': os.environ['SCENARIO'], 'seed': int(os.environ['SEED']),
                    'horizon_months': 6000, 'observation_interval_months': 120,
                    'input_contract': '기존 CLI --growth-scenario/--growth-seed. a/b/c 가정·기간·시드·법칙 변경 없음'}
          (root / 'provenance/source.json').write_text(json.dumps(source, ensure_ascii=False, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('PRODUCT_FINGERPRINT=' + fingerprint + '\nPRODUCT_VERSION=' + version + '\n')
          PY
      - name: 모든 출력이 체크아웃 밖인 Release 빌드
        run: |
          set -o pipefail
          dotnet build tests/Chronicles.Game.Tests -c Release -m:1 --artifacts-path "$RESULT_DIR/build" \
            -p:ContinuousIntegrationBuild=true -p:SourceRevisionId="$SOURCE_SHA" \
            -p:IncludeSourceRevisionInInformationalVersion=true -p:UseSharedCompilation=false \
            2>&1 | tee "$RESULT_DIR/logs/build.log"
          git status --porcelain --untracked-files=all > "$RESULT_DIR/provenance/git-after-build.txt"
          test ! -s "$RESULT_DIR/provenance/git-after-build.txt"
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['RESULT_DIR'])
          candidates = list((root / 'build/bin').rglob('Chronicles.Game.Tests.dll'))
          assert len(candidates) == 1 and candidates[0].is_relative_to(root)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('TEST_DLL=' + str(candidates[0]) + '\nBUILD_OUTPUT=' + str(candidates[0].parent) + '\n')
          PY
      - name: 실제 네 DLL PE의 소스·버전·SHA256 검증
        run: |
          inspector="$RESULT_DIR/tools"
          mkdir -p "$RESULT_DIR/provenance/assemblies"
          cat > "$inspector/Inspector.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup></Project>
          XML
          cat > "$inspector/Program.cs" <<'CS'
          using System.Reflection.Metadata;
          using System.Reflection.PortableExecutable;
          using System.Runtime.InteropServices;
          using System.Security.Cryptography;
          using System.Text.Json;
          var folder = Path.GetFullPath(args[0]); var sha = args[1]; var version = args[2]; var output = args[3];
          var rows = new List<object>();
          foreach (var name in new[] { "Chronicles.Core", "Chronicles.Game", "Chronicles.Hosting", "Chronicles.Game.Tests" })
          {
              var path = Path.Combine(folder, name + ".dll");
              using var stream = File.OpenRead(path); using var pe = new PEReader(stream);
              var metadata = pe.GetMetadataReader(); var definition = metadata.GetAssemblyDefinition(); string? information = null; string? configuration = null;
              foreach (var handle in definition.GetCustomAttributes())
              {
                  var attribute = metadata.GetCustomAttribute(handle);
                  EntityHandle parent = attribute.Constructor.Kind switch
                  {
                      HandleKind.MemberReference => metadata.GetMemberReference((MemberReferenceHandle)attribute.Constructor).Parent,
                      HandleKind.MethodDefinition => metadata.GetMethodDefinition((MethodDefinitionHandle)attribute.Constructor).GetDeclaringType(),
                      _ => default
                  };
                  if (parent.Kind != HandleKind.TypeReference) continue;
                  var type = metadata.GetTypeReference((TypeReferenceHandle)parent);
                  var attributeName = metadata.GetString(type.Name);
                  if (metadata.GetString(type.Namespace) != "System.Reflection" ||
                      attributeName is not ("AssemblyInformationalVersionAttribute" or "AssemblyConfigurationAttribute")) continue;
                  var value = metadata.GetBlobReader(attribute.Value);
                  if (value.ReadUInt16() != 1) throw new InvalidDataException("잘못된 assembly 정보 형식");
                  var text = value.ReadSerializedString();
                  if (attributeName == "AssemblyInformationalVersionAttribute") information = text; else configuration = text;
              }
              if (metadata.GetString(definition.Name) != name || information != version + "+" + sha || configuration != "Release")
                  throw new InvalidDataException(name + " 실제 DLL의 소스 revision이 고정 소스와 다릅니다: " + information);
              rows.Add(new { name, version = definition.Version.ToString(), informationalVersion = information, configuration,
                  bytes = new FileInfo(path).Length, sha256 = Convert.ToHexStringLower(SHA256.HashData(File.ReadAllBytes(path))) });
          }
          File.WriteAllText(output, JsonSerializer.Serialize(new { source_commit = sha, runtime = RuntimeInformation.FrameworkDescription,
              cpu_count = Environment.ProcessorCount, total_available_memory_bytes = GC.GetGCMemoryInfo().TotalAvailableMemoryBytes,
              os = RuntimeInformation.OSDescription, assemblies = rows }, new JsonSerializerOptions { WriteIndented = true }));
          if (RuntimeInformation.FrameworkDescription != ".NET 10.0.14")
              throw new InvalidOperationException("실제 runtime이 기준선의 .NET 10.0.14와 다릅니다: " + RuntimeInformation.FrameworkDescription);
          CS
          set -o pipefail
          dotnet run --project "$inspector/Inspector.csproj" -c Release -- \
            "$BUILD_OUTPUT" "$SOURCE_SHA" "$PRODUCT_VERSION" \
            "$RESULT_DIR/provenance/assemblies.json" 2>&1 | tee "$RESULT_DIR/logs/assembly-inspector.log"
          for name in Chronicles.Core Chronicles.Game Chronicles.Hosting Chronicles.Game.Tests; do
            cp "$BUILD_OUTPUT/$name.dll" "$RESULT_DIR/provenance/assemblies/"
          done
      - name: 같은 원형 CLI로 선택 1조건의 6000개월 관측
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, time
          root = pathlib.Path(os.environ['RESULT_DIR'])
          assert not any((root / 'out').iterdir()), '이전 원본을 덮어쓰지 않습니다'
          command = ['dotnet', os.environ['TEST_DLL'], '--filter', 'INV-001/002/011', '--report', str(root / 'out/genesis.json'),
                     '--growth', str(root / 'out/growth.json'), '--growth-scenario', os.environ['SCENARIO'], '--growth-seed', os.environ['SEED']]
          data = {'command': command, 'source_commit': os.environ['SOURCE_SHA'], 'scenario': os.environ['SCENARIO'],
                  'seed': int(os.environ['SEED']), 'started_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'monotonic_started': time.monotonic(), 'wall_cap_minutes': 330,
                  'timeout_meaning': '중단이면 실패·원시 partial/pending 보존. 6000개월 단축이나 완주 재라벨이 아님'}
          (root / 'provenance/process-start.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          set +e
          timeout --signal=TERM --kill-after=30s 330m dotnet "$TEST_DLL" \
            --filter INV-001/002/011 --report "$RESULT_DIR/out/genesis.json" \
            --growth "$RESULT_DIR/out/growth.json" --growth-scenario "$SCENARIO" --growth-seed "$SEED" \
            2>&1 | tee "$RESULT_DIR/logs/growth.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          python3 - "${statuses[0]}" "${statuses[1]}" <<'PY'
          import datetime, json, os, pathlib, sys, time
          root = pathlib.Path(os.environ['RESULT_DIR'])
          start = json.loads((root / 'provenance/process-start.json').read_text())
          data = {'process_exit': int(sys.argv[1]), 'log_exit': int(sys.argv[2]),
                  'finished_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'wall_seconds_including_genesis_logging_and_report_io': time.monotonic() - start['monotonic_started'],
                  'timeout_exit_124_or_137_is_failure': True, 'raw_growth_report_modified_by_workflow': False}
          (root / 'provenance/process-exit.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"
      - name: 선택 완주·소스·기간·DLL 원본 정합 확인
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RESULT_DIR'])
          assert not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True).strip()
          genesis = json.loads((root / 'out/genesis.json').read_text())
          assert genesis['selection'] == 'INV-001/002/011' and genesis['total'] == 1 and genesis['failed'] == 0 and genesis['results'][0]['passed'] is True
          report = json.loads((root / 'out/growth.json').read_text())
          expected = {'scenario': os.environ['SCENARIO'], 'seed': int(os.environ['SEED'])}
          assert report['sourceCommit'] == os.environ['SOURCE_SHA'] and report['productSourceFingerprint'] == os.environ['PRODUCT_FINGERPRINT']
          assert report['horizonMonths'] == 6000 and report['observationIntervalMonths'] == 120 and report['requestedCases'] == [expected]
          assert report['requested_complete'] is True and report['complete'] is False and report['status'] == 'requested-completed'
          assert report['runningCase'] is None and report['completedCases'] == 1 and len(report['reports']) == 1
          row = report['reports'][0]
          assert row['scenario'] == expected['scenario'] and row['seed'] == expected['seed'] and row['status'] == 'completed' and row['error'] is None
          assert row['observedThroughMonth'] == 6000 and [p['month'] for p in row['timeSeries']] == list(range(0, 6001, 120))
          assert report['environment']['runtime'] == '.NET 10.0.14' and report['environment']['sourceWorktreeClean'] is True
          evidence = json.loads((root / 'provenance/assemblies.json').read_text())
          for assembly in evidence['assemblies']:
              binary = pathlib.Path(os.environ['BUILD_OUTPUT']) / (assembly['name'] + '.dll')
              assert hashlib.sha256(binary.read_bytes()).hexdigest() == assembly['sha256']
              assert hashlib.sha256((root / 'provenance/assemblies' / binary.name).read_bytes()).hexdigest() == assembly['sha256']
          (root / 'provenance/selected-completion.json').write_text(json.dumps({'selected_case_complete': True, 'nine_cases_complete_claim': False,
              'source_commit': os.environ['SOURCE_SHA'], **expected, 'final_hash': row['finalHash']}, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: 실패·시간 초과에도 원본과 환경·파일 해시 보존
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path(os.environ['RESULT_DIR'])
          def optional(path):
              p = pathlib.Path(path)
              return p.read_text().strip() if p.is_file() else None
          after = {'meminfo': optional('/proc/meminfo'), 'disk_bytes': dict(shutil.disk_usage(root)._asdict()),
                   'cgroup_memory_events': optional('/sys/fs/cgroup/memory.events'),
                   'cgroup_memory_current': optional('/sys/fs/cgroup/memory.current'), 'cgroup_memory_peak': optional('/sys/fs/cgroup/memory.peak')}
          (root / 'environment/after.json').write_text(json.dumps(after, ensure_ascii=False, indent=2) + '\n')
          files = {}
          for name in ['out', 'logs', 'environment', 'provenance', 'tools']:
              for path in (root / name).rglob('*'):
                  if path.is_file() and path.name != 'raw-manifest.json' and not any(p in ('bin', 'obj') for p in path.relative_to(root).parts):
                      files[str(path.relative_to(root))] = {'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
          (root / 'provenance/raw-manifest.json').write_text(json.dumps(files, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: 조건·시드별 원시 실측과 실패 기록 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v021-growth-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}-${{ matrix.seed }}
          path: |
            ${{ env.RESULT_DIR }}/out/
            ${{ env.RESULT_DIR }}/logs/
            ${{ env.RESULT_DIR }}/environment/
            ${{ env.RESULT_DIR }}/provenance/
            ${{ env.RESULT_DIR }}/tools/Program.cs
            ${{ env.RESULT_DIR }}/tools/Inspector.csproj
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: 같은 소스의 완료 원본 9개 통합
    needs: growth
    if: ${{ needs.growth.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha }}
    steps:
      - name: 통합 경로를 체크아웃 밖에 준비
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE_SHA'])
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / f"v021-growth-aggregate-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          root.mkdir(parents=True, exist_ok=False)
          for name in ['inputs', 'out', 'logs', 'provenance']:
              (root / name).mkdir()
          (root / 'provenance/request.json').write_text(json.dumps({
              'source_commit': os.environ['SOURCE_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'scope': '같은 실행 원본 9개의 사후 검증만 수행'},
              ensure_ascii=False, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('AGGREGATE_DIR=' + str(root) + '\n')
          PY
      - name: 같은 이벤트 소스 가져오기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hddy774/project-hora
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: 현재 실행·시도의 9개 원본만 내려받기
        uses: actions/download-artifact@v4
        with:
          pattern: v021-growth-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ env.AGGREGATE_DIR }}/inputs
          merge-multiple: false
      - name: 기존 통합기의 검증으로만 9조건 완료 판단
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['AGGREGATE_DIR'])
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['SOURCE_SHA']
          assert not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True).strip()
          reports = sorted((root / 'inputs').glob('*/out/growth.json'))
          assert len(reports) == 9, '서로 다른 완료 원본 9개가 필요합니다'
          args = ['python3', 'scripts/aggregate-v021-growth.py', *(str(p) for p in reports), '--source', os.environ['SOURCE_SHA'], '--output', str(root / 'out/growth-aggregate.json')]
          with (root / 'logs/aggregate.log').open('w') as stream:
              subprocess.run(args, stdout=stream, stderr=subprocess.STDOUT, check=True)
          result = json.loads((root / 'out/growth-aggregate.json').read_text())
          assert result['complete'] is True and result['completedCases'] == 9
          record = {'source_commit': os.environ['SOURCE_SHA'], 'product_source_fingerprint': result['productSourceFingerprint'],
                    'raw_input_sha256': {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in reports},
                    'scope': '9개 원본의 사실만 검증·통합. 조건/시드/기간 변경·기존 로컬 원본 교체·재라벨 없음',
                    'time_limit': '서로 다른 VM의 입력 elapsed 합계는 병렬 전체 wall 시간이나 같은 물리 CPU의 paired 성능 비교가 아님',
                    'no_new_simulation_in_aggregator': True}
          (root / 'provenance/aggregate.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: 통합 산출물과 실패 로그 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v021-growth-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.AGGREGATE_DIR }}/out/
            ${{ env.AGGREGATE_DIR }}/logs/
            ${{ env.AGGREGATE_DIR }}/provenance/
          if-no-files-found: error
          retention-days: 14
