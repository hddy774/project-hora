name: 0.2.1 product validation
on:
  pull_request:
  push:
    branches: [main, codex/v0.2.1]
  workflow_dispatch:
    inputs:
      final_validation:
        description: Run the legacy regression and performance suite after all features are complete
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: v021-product-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: mkdir -p artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify committed offline UI asset
        run: |
          npm ci --prefix scripts/shell-assets --ignore-scripts --no-audit --no-fund
          node scripts/build-shell-assets.mjs --check
      - name: Planning ledger and negative cases
        run: python3 scripts/validate-v021-plan.py --self-test
      - name: Static current-product boundary
        run: python3 scripts/validate-v021-product-boundary.py --self-test --report artifacts/product-boundary.json
      - name: Portable product scenarios
        run: dotnet run --project tests/Chronicles.Game.Tests -c Release -- --report artifacts/product-tests.json
      - name: Portable shell build
        run: dotnet build src/Chronicles.Shell -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: product-evidence
          path: artifacts/
          retention-days: 3
      - name: Preserve results in job summary
        if: always()
        run: cat artifacts/product-tests.json >> "$GITHUB_STEP_SUMMARY"
  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/Chronicles.Desktop -c Release
      - name: Legacy regression including performance — final validation only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.final_validation }}
        run: dotnet run --project legacy/windows-pre-v021/tests/Chronicles.Tests -c Release
      - run: ./scripts/validate-architecture.ps1
      - name: Desktop actual render and bridge
        shell: pwsh
        run: |
          $process = Start-Process ./src/Chronicles.Desktop/bin/Release/net10.0-windows/Chronicles.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw 'Desktop smoke timeout' }
          Get-Content (Join-Path ([IO.Path]::GetTempPath()) 'seonro-smoke-result.json')
          if ($process.ExitCode -ne 0) { throw 'Desktop smoke failed' }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: dotnet workload install android
      - name: Android SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: mkdir -p artifacts
      - name: Build APK
        run: dotnet build src/Chronicles.Android -c Release -m:1 -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
      - name: Enable KVM for Android runtime check
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r src/Chronicles.Android/bin/Release/net10.0-android/org.hora.xianxiaobserver-Signed.apk
            adb shell am start -n org.hora.xianxiaobserver/crc649632d1cee893af2a.MainActivity
            sleep 20
            adb logcat -d -s SeonroRender:I SeonroWeb:W AndroidRuntime:E > artifacts/android-render-log.txt
            cat artifacts/android-render-log.txt
            adb shell uiautomator dump /sdcard/seonro-ui.xml
            adb pull /sdcard/seonro-ui.xml artifacts/android-ui.xml
            cat artifacts/android-ui.xml
            adb exec-out screencap -p > artifacts/android-screen.png
            python3 scripts/verify-android-ui.py artifacts/android-ui.xml artifacts/android-render-log.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-validation-apk
          path: src/Chronicles.Android/bin/Release/net10.0-android/*Signed.apk
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: android-runtime-evidence
          path: artifacts/
          retention-days: 3
