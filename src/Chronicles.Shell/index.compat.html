<button onclick="advance(1)">1개월</button><button onclick="advance(12)">1년</button><span class="space"></span>
<button id="observer" onclick="issueCommand('observe')" hidden>관찰로 전환</button><button id="peopleInbox" onclick="inspect(view.actor)" hidden>받은 개인 요청</button><button onclick="send({type:'save',slot:+document.getElementById('slot').value})">저장</button><button onclick="loadDialog()">불러오기</button>
<label><span class="sr-only">저장 슬롯</span><select id="slot" aria-label="저장 슬롯"><option value="0">슬롯 1</option><option value="1">슬롯 2</option><option value="2">슬롯 3</option></select></label>
</div>
<div id="feedback" aria-live="polite" aria-atomic="true"></div><div id="content" tabindex="-1"></div>

</main>
