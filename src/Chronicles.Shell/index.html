  return header('실물과 소지품',view.observer?'선택 인물의 소유 실물 또는 세계 전체의 실물':'접근 가능한 소유 실물 · 미감정 품계와 손상은 미상') + `<div class="subnav">${view.observer?`<label>소유자<select id="inventoryOwner" onchange="changeSubject(this.value)"><option value="0" ${!selected?'selected':''}>세계 전체 실물</option>${view.people.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>`:subjectPicker()}${canAct()?`<button onclick="craftDialog(${actor()})">제작 계획</button>`:''}</div>` + searchField('실물 이름·소유자·품계·출처') + table(['실물·소유자','수량·품계','수납·예약','장비·손상','행동'],rows.slice(0,200).map(i=>`<tr><td><strong>${esc(i.name)}</strong><br>${personLink(i.owner)}<br><small>${esc(i.source)}</small></td><td>${n(i.quantity)}개<br>${esc(i.quality)}</td><td>${i.container?`용기 · ${esc(item(i.container)?.name||'명칭 미상')}`:'용기 밖'}<br>${i.reserved?`${esc(kindName(view.contracts.find(c=>c.id===i.reserved)?.kind)||'작업')} 예약 중`:'예약 없음'}</td><td>${i.slot>=0?esc(slotNames[i.slot]||'장비'):'장비 아님'}<br>${i.damage==null?'손상 미상':`관측 손상 ${n(i.damage)} / 100`}${i.appraisedMonth==null?'':`<br><small>감정 ${year(i.appraisedMonth)}</small>`}${i.equippedSlots?.length?'<br>장착 · '+i.equippedSlots.map(slot=>esc(slotNames[slot]||'장비')).join(' · '):i.slot>=0?'<br>장착 상태 '+(i.equippedSlot==null?'미상':'미장착'):''}</td><td><button onclick="itemDialog(${i.id})">실물·행동</button></td></tr>`),'접근 가능한 실물이 없거나 검색 결과가 없습니다.') + `<p class="muted">제공된 실물 ${n(rows.length)}건 · 최대 200행. 장착·수납·수리·출품·운송의 실제 가능 여부는 제출할 때 확인합니다.</p>` + resourcePanel();
}
function groupsPage() {

  return header('가문과 세력','가계·종문 소속, 독립 주권과 봉신 관계를 구분합니다.',canAct()?`<button onclick="foundDialog(${actor()})">가문·종문 창설</button>`:'') + (groupFocus?'<button class="back" onclick="back()">← 이전 화면</button>':searchField('세력·종류·수장')) + `<div class="grid">${visible.map(g=>{
    const authorized=!g.dissolved&&!personInside(person(g.leader))&&(view.observer||view.actor===g.leader),vassals=view.groups.filter(v=>v.overlord===g.id&&!v.dissolved);
    return `<article class="card wide" id="group-${g.id}"><div class="row"><h3>${esc(g.name)}</h3><span class="tag">${esc(kindName(g.kind))}</span></div><p>수장 · ${personLink(g.leader)}</p><p>${g.dissolved?'해산 기록':g.provinces.length?'통치 · '+g.provinces.map(p=>p+1+'주').join(', '):g.kind==='Dynasty'?'무영토 왕조 · 영토 세수 0':'통치 영토 없음'}</p><dl class="facts"><div><dt>금고</dt><dd>${n(g.money)} 영석</dd></div><div><dt>정책 예약금</dt><dd>${n(g.policyEscrow)} 영석</dd></div><div><dt>채무</dt><dd>${n(g.debt)} 영석</dd></div><div><dt>${view.observer?'구성원':'인지한 구성원'}</dt><dd>${n(g.members.length)}명</dd></div><div><dt>상위 주권</dt><dd>${g.overlord?esc(group(g.overlord)?.name||'미상'):'독립'}</dd></div><div><dt>${view.observer?'봉신':'인지한 봉신'}</dt><dd>${vassals.map(v=>`<button onclick="focusGroup(${v.id})">${esc(v.name)}</button>`).join(' ')||'기록 없음'}</dd></div></dl><details><summary>구성원과 관계</summary><div class="stack">${g.members.map(id=>personLink(id)).join('')}</div></details><h3 class="section">10분류 운영 정책</h3>${Object.entries(g.policies).map(([k,v])=>`<div class="row listrow"><div>${esc(k)}<br><small>${esc(policyChoice(k,v))}</small></div>${authorized?`<button onclick="policyDialog(${g.id},'${esc(k)}',${v})">정책 변경</button>`:''}</div>`).join('')}${policyPreparationPanel(g,authorized)}<div class="stack section"><button onclick="showEvents('group',${g.id})">관련 연대기</button>${!g.dissolved&&g.kind==='Sect'&&!g.members.includes(actor())?`<button onclick="issueCommand('join',${g.id})">입문 요청</button>`:''}${authorized?`<button onclick="fundGroupDialog(${g.id})">개인 잔액으로 예산 대여</button>${g.kind!=='Sect'?`<button onclick="governDialog(${g.id})">주 통치</button><button onclick="vassalDialog(${g.id})">봉신·독립</button>`:''}${g.provinces.length?`<button onclick="releaseDialog(${g.id})">주권 반납</button>`:''}<button class="danger" onclick="dissolveDialog(${g.id})">해산 요청</button>`:''}</div></article>`;
  }).join('')||empty('이 모드에서 인지한 세력이 없습니다. 실제 창설과 입문으로 관계가 생깁니다.')}</div>`;
}
function marketPage() {
  const contracts=view.contracts.filter(c=>match(kindName(c.kind),contractStatus(c.status),person(c.seller)?.name,contractItemName(c)));
  return header('시장과 계약','실제 판매자·실물·예치금으로 거래하고, 운송 완료와 판매 정산을 구분합니다.') + `<div class="card">${subjectPicker()}${view.inSecretRealm?'<p class="notice">비경 안에서는 바깥의 새 출품·시세·거점을 확인할 수 없습니다. 자기 계약 기록을 유지하며 실제 귀환 뒤 현장을 확인합니다.</p>':''}<p class="muted">구매·입찰은 실제 위치와 자금을 판정합니다. 실물의 이름을 모르는 계약도 임의로 보강하지 않습니다.</p><button onclick="go('items')">소유 실물 출품·운송</button></div>` + searchField('종류·상태·판매자·아는 실물 이름') + table(['계약·실물','당사자','가격·예치','목적지·기한','상태·행동'],contracts.map(c=>`<tr><td>${esc(kindName(c.kind))}<br>${esc(contractItemName(c))}${c.itemQuantity==null?'':` · ${n(c.itemQuantity)}개`}${c.itemQuality==null?'':`<br>${esc(c.itemQuality)}`}<details><summary>계약 참조</summary>계약 ${n(c.id)} · 실물 ${n(c.item)}</details></td><td>${personLink(c.seller)}<br><small>${c.buyer?'상대 · ':''}</small>${c.buyer?personLink(c.buyer):''}</td><td>${c.kind==='transport'?'운송 계약':n(c.price)+' 영석'}<br>${c.escrow==null?'예치액 미상':n(c.escrow)+' 영석 예치'}</td><td>${esc(place(c.place)?.name||'장소 미상')}<br>${year(c.due)}</td><td>${esc(contractStatus(c.status))}<div class="stack">${c.status==='open'&&canAct()?(c.seller===actor()?c.kind==='transport'?'<span class="muted">운송 완료 대기</span>':`<button onclick="issueCommand('withdraw',${c.id})">철회</button>`:c.kind==='auction'?`<button onclick="bidDialog(${c.id},${c.price})">입찰</button>`:c.kind==='sale'?`<button onclick="tradeDialog(${c.id})">구매</button>`:''):''}</div></td></tr>`),'인지한 거래나 운송 계약이 없습니다. 소유 실물에서 출품할 수 있습니다.') + currencyPanel() + economyPanel();
}
function currencyPanel() {
  const exchange=view.currencyExchange;if(!exchange)return '';
  const tokens=view.items.filter(i=>i.owner===actor()&&i.definition===exchange.definition&&!i.reserved);
  return `<section class="card section" data-section="currency"><h3>실물 영석과 잔액</h3><p>${exchange.enabled?`${esc(exchange.tokenUnit)} → ${n(exchange.moneyPerToken)} ${esc(exchange.moneyUnit)}`:'현재 법칙에서 실물 전환이 비활성입니다.'}</p><p class="muted">${esc(exchange.qualityPolicy)}</p>${canAct()&&exchange.enabled?tokens.map(i=>`<button onclick="currencyDialog(${i.id})">${esc(i.name)} ${n(i.quantity)}개 · 전환 계획</button>`).join(' ')||empty('현지에서 접근 가능한 미예약 실물 영석이 없습니다.') : ''}</section>`;
}
function currencyDialog(id) {
  const token=item(id),exchange=view.currencyExchange;if(!token||!exchange)return;
  dialog('실물 영석의 잔액 전환',`<p>${esc(token.name)} · 접근 가능한 ${n(token.quantity)}개</p><label>전환할 실제 수량<input id="currencyQuantity" type="number" min="1" max="${token.quantity}" step="1" required value="1"></label><p>개당 ${n(exchange.moneyPerToken)} 영석 잔액으로 전환하고 실물을 소비합니다.</p><p class="muted">${esc(exchange.qualityPolicy)} 실제 기능·예약·소유권은 제출할 때 판정합니다.</p>`,()=>issueCommand('redeemCurrency',id,+$('currencyQuantity').value),'실물 소비·전환 요청');
}
function economyPanel() {
  const e=view.economy;if(!e)return '';
  const price=value=>value==null?'거래 근거 없음':n(value/1000)+' 영석 / 개';
  const site=id=>`<button onclick="placeDialog(${id})">${esc(place(id)?.name||'지점 명칭 미상')}</button>`;
  const evidence=sources=>`<details><summary>기록 출처</summary>${sources.map(s=>`<p><small>${esc(eventText(s))}</small></p>`).join('')}</details>`;
  const changeKinds=['고갈','재생','재해','통로 폐쇄','통로 회복','거래 집중','교육 기반 상실','가계 기반 상실','출산 지원 병목','시설 형성','시설 중단'];
  return `<section class="card section" data-section="economy"><h3>${view.observer?'지역 경제의 실제 기록':'내 생계와 현지 거래 기록'}</h3><p class="muted">${year(e.month)} 기준 · 가격은 실제 공개 호가와 완료된 거래의 단가입니다. 거래 근거가 없으면 미상이며, 수요만으로 가격을 만들지 않습니다.</p>${table(['시점·위치','실물','공개 공급·완료 수량','호가·실제 체결'],e.publicPrices.map(r=>`<tr><td>${year(r.month)}<br>${site(r.place)}</td><td>${esc(itemName(r.definition))}</td><td>${n(r.publicSupply)}개 · ${n(r.tradedQuantity)}개</td><td>${price(r.askPerUnitMilli)}<br>${price(r.paidPerUnitMilli)}${evidence(r.sources)}</td></tr>`),'아직 공개 공급이나 완료된 거래 가격의 기록이 없습니다.')}<details data-section="personal-demand"><summary>${view.observer?'실제 부문별 수요':'나의 기록된 생계 수요와 접근 재고'}</summary>${table(['시점·장소','실물·용도','필요·실제 소비','접근 재고·재원'],e.demand.map(d=>`<tr><td>${year(d.month)}<br>${site(d.place)}</td><td>${esc(itemName(d.definition))}<br>${esc(({person:'개인 생계',household:'가계',organization:'조직',cultivation:'수행',production:'생산'})[d.sector]||'실제 수요')}</td><td>${n(d.needed)}개 · ${n(d.consumed)}개</td><td>${n(d.accessibleStock)}개 · ${n(d.availableMoney)} 영석<br><small>${esc(eventText(d.source))}</small></td></tr>`),'기록된 수요가 없습니다.')}</details><details data-section="consumption"><summary>실제 소비와 확인된 손실</summary>${table(['시점·위치','실물','실제 소비','증거'],e.consumption.map(c=>`<tr><td>${year(c.month)}<br>${site(c.place)}</td><td>${esc(itemName(c.definition))}</td><td>${n(c.quantity)}개</td><td>${esc(eventText(c.source))}</td></tr>`),'확인한 실제 소비 기록이 없습니다.')}${e.losses.map(l=>`<p>${year(l.month)} · ${esc(itemName(l.definition))} ${n(l.quantity)}개 손실 · ${site(l.place)}<br><small>${esc(eventText(l.source))}</small></p>`).join('')}</details><details data-section="facilities"><summary>실제로 활동한 정착·교역 거점</summary>${e.facilities.map(f=>`<article class="listrow"><strong>${esc(f.name)}</strong> · ${site(f.place)}<p>${f.active?'활동 중':'활동 중단'} · ${year(f.founded)} 형성 · ${year(f.lastActivity)} 최근 활동</p><p>인지한 운영자 · ${f.operators.map(id=>personLink(id)).join(' · ')||'미상'}</p>${evidence(f.sources)}</article>`).join('')||empty('확인한 활동 거점이 없습니다.')}<p class="muted">시설 이름은 실제 활동의 기록입니다. 실물·노동·통치권을 대신 만들지 않습니다.</p></details>${view.observer?`<details data-section="regional-economy"><summary>관찰 전용 지역 수요·생산·실물 재고</summary>${table(['시점·위치','실물','수요·소비·생산','총재고·공개 공급','판매자·거래 집중'],e.regions.map(r=>`<tr><td>${year(r.month)}<br>${site(r.place)}</td><td>${esc(itemName(r.definition))}</td><td>${n(r.needed)} · ${n(r.consumed)} · ${n(r.produced)}개</td><td>${n(r.physicalStock)} · ${n(r.publicSupply)}개</td><td>${n(r.sellers)}명 · ${n(r.concentrationBasisPoints/100)}%${evidence(r.sources)}</td></tr>`),'지역 결산이 아직 없습니다.')}</details><details data-section="natural-flows"><summary>관찰 전용 자연 자원 흐름과 변화 원인</summary>${table(['시점·위치','기초·재생','채취·손실','기말·영기'],e.naturalFlows.map(f=>`<tr><td>${year(f.month)}<br>${site(f.place)}</td><td>${n(f.opening)} · +${n(f.regeneration)} 단위</td><td>−${n(f.extraction)} · −${n(f.loss)} 단위</td><td>${n(f.closing)} 단위<br>${n(f.qiBefore)} → ${n(f.qiAfter)} 영기${evidence(f.sources)}</td></tr>`),'자연 흐름의 실제 결산이 아직 없습니다.')}${e.changes.map(c=>`<p>${year(c.month)} · ${site(c.place)} · ${esc(changeKinds[c.kind]||'지역 변화')} · ${n(c.before)} → ${n(c.after)}<br><small>${esc(eventText(c.source))}</small></p>`).join('')}</details>`:''}</section>`;
}

const secretStatusName=status=>({Active:'조사 진행 중',Returning:'실제 귀환 중',Completed:'조사 완료·귀환',Failed:'조사 실패·종결',Returned:'귀환 완료',Aborted:'실제 조건 상실로 종결'})[status]||'상태 미상';
function observedOpening(entrance) {
  if(entrance.openNow!=null)return entrance.openNow?'관찰: 현재 개방':'관찰: 현재 닫힘';
  if(!(entrance.period>0)||!(entrance.openMonths>0))return '개방 일정 미상';
  const phase=((view.month-entrance.offset)%entrance.period+entrance.period)%entrance.period;
  return phase<entrance.openMonths?'기록된 일정상 개방 기간 · 현재 현장 미확인':'기록상 다음 개방 '+year(view.month+entrance.period-phase)+' · 현재 현장 미확인';
}
function explorationPanel(who=actor(),onlyPlace=null) {
  const data=view.exploration;if(!data||(!view.observer&&who!==view.actor))return '';
  const p=person(who),entries=data.ownEntries.filter(e=>e.person===who),entrances=data.entrances.filter(e=>onlyPlace==null||e.place===onlyPlace);

ress],Math.max(1,e.required),'개월')}<p>조사 진척 ${n(e.progress)} / ${n(e.required)}개월 · 준비에 실제 소비한 식량 ${n(e.foodSpent)}개</p><p>조사 도구 · ${item(e.tool)?`<button onclick="itemDialog(${e.tool})">${esc(item(e.tool).name)}</button>`:'이 실물의 현재 접근은 미상'} · 직접 입은 피해 ${n(e.injury)} 건강점</p><p>${esc(e.preparation)}</p>${e.rewardQuantity>0?`<p>실제로 획득한 ${n(e.rewardQuantity)}개 · ${item(e.rewardItem)?`<button onclick="itemDialog(${e.rewardItem})">${esc(item(e.rewardItem).name)}</button>`:'획득 당시 실물 기록'}</p>`:!['Active','Returning'].includes(e.status)?'<p>이번 입장에서 실제 획득한 보상은 없습니다.</p>':'<p class="muted">현재 보상을 획득하지 않았으며, 완료 전에 남은 원천을 보증하지 않습니다.</p>'}${e.endReason?`<p>${esc(e.endReason)}</p>`:''}${e.status==='Active'?`<button onclick="secretReturnDialog(${who})">귀환 준비 검토</button>`:e.status==='Returning'?'<p class="muted">다음 처리 시점까지 실제 귀환을 기다립니다.</p>':''}${view.observer?`<details><summary>관찰 전용: 입장 때 고정한 실제 준비·위험</summary><p>위험 ${n(e.actualRisk)} / 10000 · 판정 표본 ${n(e.actualRoll)} / 10000 · 실제 도구 품질 ${n(e.actualToolQuality)} / 10000</p>${e.actualRules?`<p>채택 당시 조사 ${n(e.actualRules.months)}개월 · 식량 ${n(e.actualRules.food)}개 · 정원 ${n(e.actualRules.capacity)}명</p>`:''}<small>${esc(e.actualKnowledgeSource||'출처 미상')}</small></details>`:''}</article>`).join('')||empty('실제 입장한 기록이 없습니다.')}${current?'<p class="notice">비경 안에서는 바깥의 새로운 출품·시세·바닥 실물을 현재 정보로 확인하지 않습니다. 실제 귀환 뒤 현장을 다시 확인하세요.</p>':''}</section>`;

function dialog(title,fields,submit,confirmLabel='명령 제출') {

  $('dialogform').innerHTML=`<h2 id="dialog-title">${esc(title)}</h2>${fields}<p id="dialog-error" class="error" role="alert"></p><div class="stack dialog-actions"><button type="button" onclick="document.getElementById('dialog').close()">닫기</button>${submit?`<button type="submit" class="primary" id="confirm">${esc(confirmLabel)}</button>`:''}</div>`;

function importLaws() {
  dialog('세계 법칙 값 가져오기','<label>내보낸 JSON 값 붙여넣기<textarea id="lawImport" rows="10" required maxlength="16000"></textarea></label><p>알려진 법칙의 정수 값과 허용 범위를 확인한 뒤 차이를 미리 보여 줍니다.</p>',()=>{
    try {const parsed=JSON.parse($('lawImport').value);if(!parsed||!parsed.laws||typeof parsed.laws!=='object'||Array.isArray(parsed.laws))throw new Error();const changes=[];for(const [id,value] of Object.entries(parsed.laws)){const l=view.laws.find(l=>l.id===id);if(!l||!Number.isSafeInteger(value)||value<l.minimum||value>l.maximum)throw new Error();if(l.value!==value)changes.push({id,value});}previewLawBatch(changes,'가져올 법칙 차이 검토');return false;}
    catch(error){$('dialog-error').textContent='형식·정수 값·법칙 이름과 허용 범위를 확인하세요.';return false;}
  },'차이 검토');
}
function createPerson() {
  const species=view.species||[];
  if(!species.length)return noCandidates('인물 편입','공개된 종 정의를 아직 불러오지 못했습니다.');
  dialog('새 인물의 명시적 편입',`<label>이름<input id="newname" maxlength="40" required value="무명"></label>${selectField('newspecies','종과 자연 육신',species.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · 성숙 ${n(s.maturityMonths)}개월 · 기본 수명 ${n(s.basicLifespanMonths)}개월</option>`).join(''))}${selectField('newplace','시작 위치',options(view.places))}${selectField('profile','생식 기능','<option value="0">수정 기능</option><option value="1">출산 기능</option>')}<p>해당 종의 성인·자연 육신·외부 기원으로 편입합니다. 자산과 숙련을 지급하지 않습니다. 정착지 적합성과 실제 육신 기능에 따라 행동을 판정합니다.</p>`,()=>issueCommand('create',+$('newplace').value,0,JSON.stringify({name:$('newname').value,species:$('newspecies').value,gestates:$('profile').value==='1'}),0));
}
function activeRecipes() {
  return view.recipes?.length ? view.recipes : recipes.map(([id,name,inputs])=>({id,name,outputName:name,quantity:1,inputsLabel:inputs}));
}
function recipeOption(r) {
  const inputs=r.inputs?.map(i=>`${i.name} ${n(i.quantity)}개`).join(' · ')||r.inputsLabel||'재료 없음';
  return `<option value="${esc(r.id)}">${esc(r.name)} · ${n(r.quantity)}개 · ${esc(inputs)}</option>`;
}
function filterRecipes(value) {
  const chosen=$('recipe').value;
  $('recipe').innerHTML=activeRecipes().filter(r=>(r.name+' '+r.outputName+' '+(r.inputs||[]).map(i=>i.name).join(' ')).includes(value)).map(recipeOption).join('');
  if([...$('recipe').options].some(o=>o.value===chosen))$('recipe').value=chosen;
}

 ${year(c.observedMonth)} · 수신 ${year(c.receivedMonth)}${c.expiresMonth==null?'':` · 만료 ${year(c.expiresMonth)}`}</p><p class="muted">${c.provenance.map(h=>`${year(h.receivedMonth)} · ${esc(h.evidenceId)}`).join(' → ')}</p></article>`).join('')||empty('실제로 받은 명성 기록이 없습니다.')}${p.actualEvaluations?`<details data-section="actual-evaluations"><summary>관찰 전용 실제 천교 평가 이력</summary>${p.actualEvaluations.map(e=>`<article class="listrow"><h3>${year(e.month)} · ${esc(e.scope.id)}</h3><p>비교 모수 ${n(e.population.length)}명 · 평가 법칙 개정 ${n(e.lawRevision)}</p>${table(['인물','절대 자질','상대 순위','백분위'],e.population.map(r=>`<tr><td>${personLink(r.personId)}</td><td>${n(r.absoluteIndex)} / 60000</td><td>${n(r.relativeRank)} / ${n(r.population)}</td><td>${n(r.percentileBasisPoints)} / 10000</td></tr>`))}<p>천교 · ${esc(e.genius.reason)}<br>천교 후보 · ${esc(e.candidate.reason)}</p></article>`).join('')||empty('실제 평가 이력이 없습니다.')}</details>`:''}</section><section class="card section"><h3>알려진 혼 흔적 · 보존·접근·현생 통합 분리</h3>${p.knownTraces.map(t=>`<p>${esc(traces[t.domain]||'혼 흔적')} · 접근 ${n(t.accessible)} / 10000 · 통합 ${n(t.integrated)} / 10000<br><small>${year(t.observedMonth)} · ${esc(t.evidenceId)}${t.mayContainMisconception?' · 오해 가능':''}</small></p>`).join('')||empty('실제로 접근하거나 전달받은 혼 흔적 기록이 없습니다. 비공개 보존량을 추정하지 않습니다.')}${p.actualSoul?`<details data-section="actual-traces"><summary>관찰 전용 실제 보존량과 출처</summary>${p.actualSoul.values.map(t=>`<p>${esc(traces[t.domain]||'혼 흔적')} · 보존 ${n(t.preserved)} · 접근 ${n(t.accessible)} · 통합 ${n(t.integrated)}<br><small>${esc(t.source?.reference||'증거 없음')}</small></p>`).join('')}</details>`:''}</section>${p.geneticOrigin||p.genome?`<details class="card section" data-section="genetics"><summary>관찰 전용 생물학 유전 원형과 고정 시점</summary>${p.geneticOrigin?`<p>잉태 ${year(p.geneticOrigin.month)} · 법칙 개정 ${n(p.geneticOrigin.lawRevision)} · ${personLink(p.geneticOrigin.parentOne.personId)} · ${personLink(p.geneticOrigin.parentTwo.personId)}</p>`:''}${p.genome?`<p>실제 보존한 유전 원형 ${n(p.genome.genes.length)}쌍 · 종 ${esc(p.genome.speciesId)}</p>`:''}<p class="muted">유전 원형은 육신의 출처이며 영혼 계보·실제 학습과 별개입니다.</p></details>`:''}`;
}

function combatBars(d) {
  if(!d.combat)return empty('이 인물의 전투 속성은 알지 못합니다.');
  const names=view.combatAxisNames;
  if(!names)return bars(['공격','방어','속도','제어','지속','감지','관통','회복'],d.combat,Math.max(1,...d.combat),'점');
  return bars(names.slice(0,7),d.combat.slice(0,7),Math.max(1,...d.combat.slice(0,7)),'점')+`<p>유지 비용 · <strong>${n(d.combat[7])}</strong> 영기 단위 / 월<br><small>유지 비용은 낮을수록 유리합니다. 다른 일곱 축과 단위·방향이 다릅니다.</small></p>`;
}
function inventoryActivityPanel(d) {

}

}
function peopleSocialPanel(d) {
  const who=d.person.id,own=view.observer||who===view.actor;

  const oaths=(view.knownOaths||[]).filter(o=>o.person===who);

  return `<section class="card section" data-section="people-requests"><div class="row"><h3>전달된 개인 요청과 동의</h3>${d.person.status==='Alive'?`<button onclick="peopleSocialDialog(${who})">실연·진술·서약 제안</button>`:''}</div><p class="muted">제안 수락은 상대의 실연 결과나 서약 성립과 별개입니다. 양측의 동의와 실제 참여 시간이 필요합니다.</p>${requests.map(r=>`<article class="listrow"><strong>${esc(peopleRequestNames[r.kind]||'개인 대화')}</strong> · <span class="tag">${r.status===0?'응답 대기':r.status===1?'양측 참여 중':'상태 미상'}</span><p>${personLink(r.proposer)} → ${personLink(r.recipient)}</p><p>${r.kind===0?'실연 영역 · '+esc(talentNames[r.talentIndex]||'영역 미상'):r.kind===2?'제안한 약속 · '+esc(r.terms):'본인이 받은 진술을 전달하는 대화'}</p><small>${year(r.requested)} 전달 · ${year(r.expires)} 응답 기한</small>${r.status===0&&r.recipient===who&&d.person.status==='Alive'?`<div class="stack section"><button onclick="peopleConsentDialog(${r.id},true,${who})">참여 수락 검토</button><button onclick="peopleConsentDialog(${r.id},false,${who})">요청 거절 검토</button></div>`:''}${r.status===1?'<p class="muted">실제 진행과 완료 예정은 현재 행동에서 확인하세요.</p>':''}</article>`).join('')||empty('현재 전달되어 대기하거나 진행 중인 개인 요청이 없습니다.')}<p class="muted">종결된 결과와 거절·만료는 실제 사건과 받은 진술에서 확인합니다.</p></section><section class="card section" data-section="known-oaths"><h3>내가 확인한 서약</h3><p class="muted">마지막으로 전달받은 성립·파기·기한 기록입니다. 멀리 있는 상대의 생사와 새 사실을 자동으로 알아내지 않습니다.</p>${oaths.map(o=>`<article class="listrow"><strong>${esc(o.terms)}</strong><p>상대 · ${personLink(o.other)} · ${o.knownActive?'인지한 서약 유지':'종결을 확인함'}</p><p>${year(o.began)} 성립 · ${year(o.until)} 약정 기한<br><small>${year(o.observedMonth)} 마지막 통지</small></p>${o.knownActive&&o.until<=view.month?'<p class="muted">약정 기한이 지났습니다. 실제 종결 기록을 확인하세요.</p>':''}${o.knownActive&&d.person.status==='Alive'?`<button onclick="oathBreakDialog(${o.id},${who})">대면 파기 통지 검토</button>`:''}<details><summary>받은 증거 참조</summary><small>${esc(o.evidenceId)}</small></details></article>`).join('')||empty('실제로 전달받은 서약 기록이 없습니다.')}</section><details class="card section" data-section="received-claims"><summary>내가 받은 진술과 전언 경로</summary><p class="muted">실연 추정·전언·평판은 선천 원형이나 세계의 확정 등급과 다릅니다. 원 관측과 받은 시점을 구분합니다. 확신은0~10000점입니다.</p>${claims.map(c=>`<article class="listrow"><strong>${esc(c.statement)}</strong><p>진술 대상 · ${personLink(c.subjectId)}<br>확신 ${n(c.confidence)} / 10000${c.minimumEstimate==null?'':` · 추정 ${n(c.minimumEstimate)}~${n(c.maximumEstimate)}점`}</p><small>${year(c.observedMonth)} 원 관측 · ${year(c.receivedMonth)} 수신${c.expiresMonth==null?'':' · '+year(c.expiresMonth)+' 만료'}</small>${c.provenance.map(h=>`<p><small>${personLink(h.sourcePersonId)} → ${personLink(h.recipientPersonId)} · ${['직접 관측','대화·전언','문헌'][h.origin]||'출처 미상'}<br>${year(h.producedMonth)} 생성 · ${year(h.receivedMonth)} 수신</small></p>`).join('')}</article>`).join('')||empty('실제로 받은 유효한 진술이 없습니다.')}</details>${ecology?`<section class="card section" data-section="people-ecology"><h3>현재 몸이 겪은 서식 조건</h3><p>${year(ecology.month)} · ${esc(place(ecology.place)?.name||'지점 명칭 미상')} · ${esc(habitat[ecology.habitat]||'서식지 미상')}</p><dl class="facts"><div><dt>당시 서식 적합</dt><dd>${ecology.habitatSuitable?'적합함':'적합하지 않음'}</dd></div><div><dt>실제 보호 환경</dt><dd>${ecology.actualAccommodation?'이용함':'확인한 보호 환경 없음'}</dd></div><div><dt>직접 사용한 영기</dt><dd>${n(ecology.ambientQiConsumed)} 단위</dd></div><div><dt>당시 유지 건강 비용</dt><dd>${n(ecology.healthCost)}점</dd></div></dl><p class="muted">이 기록은 당시 직접 겪은 결과입니다. 다음 달의 공급과 적합성을 보증하지 않습니다.</p><details><summary>경험 출처</summary><p>${esc(ecology.source.reference)}</p><small>${year(ecology.source.month)}</small></details></section>`:''}`;
}
function peopleSocialDialog(who=actor(),initial='requestAssessment') {
  if(!view.observer&&who!==view.actor)return;
  const current=person(who),candidates=view.people.filter(p=>p.id!==who&&p.place===current?.place);
  if(!candidates.length)return noCandidates('대면 개인 제안','현재 위치에서 인지한 상대가 없습니다. 실제로 만나 관측한 상대와 대화하세요.');
  const claims=(view.receivedClaims||[]).filter(c=>c.observerId===who&&(c.expiresMonth==null||c.expiresMonth>view.month));
  dialog('실연·진술·서약 제안',`<p>행동 인물 · ${esc(current.name)}</p>${selectField('socialTarget','현지에서 인지한 상대',candidates.map(p=>`<option value="${p.id}">${esc(p.name)} · ${year(p.observed)} 관측</option>`).join(''))}<label>제안 종류<select id="socialKind" onchange="updatePeopleSocialFields()"><option value="requestAssessment">상대의 실연·평가 대화</option><option value="requestReputation" ${claims.length?'':'disabled'}>내가 받은 진술 전달${claims.length?'':' · 받은 진술 없음'}</option><option value="requestOath">조건 있는 상호 서약</option></select></label><div id="socialAssessment">${selectField('socialTalent','상대가 실연할 영역',talentNames.map((name,i)=>`<option value="${i}">${esc(name)}</option>`).join(''))}<p class="muted">상대가 동의하면 당신이 현재 실연을 평가합니다. 평가의 추정 범위와 출처를 양측이 받으며, 숨은 선천 기반은 공개되지 않습니다.</p></div><div id="socialRelay">${selectField('socialClaim','실제로 받은 진술',claims.map(c=>`<option value="${esc(c.id)}">${esc(person(c.subjectId)?.name||'대상 이름 미상')} · ${esc(c.statement)}</option>`).join(''))}<p class="muted">원 관측과 실제 전언 경로를 보존합니다. 전언은 새로운 확정 사실을 만들지 않습니다.</p></div><div id="socialOath"><label>한정된 약속 내용 · 1~80자<textarea id="socialTerms" rows="3" maxlength="80"></textarea></label><p class="muted">직접 대면한 성인 당사자 양측이 동의하고 실제 시간을 사용해야 성립합니다.</p></div><p>제안은 상대의 노동 시간을 예약하지 않습니다. 같은 장소·현재 육신·응답 기한과 실제 참여 가능 여부는 각 단계에서 판정합니다.</p>`,()=>{const kind=$('socialKind').value,data=kind==='requestOath'?$('socialTerms').value.trim():kind==='requestReputation'?$('socialClaim').value:'';if(kind==='requestOath'&&!data){$('dialog-error').textContent='1~80자의 구체적인 약속 내용을 적으세요.';return false;}return issueCommand(kind,+$('socialTarget').value,kind==='requestAssessment'?+$('socialTalent').value:0,data,who);},'상대에게 제안 전달');
  if([...$('socialKind').options].some(o=>o.value===initial&&!o.disabled))$('socialKind').value=initial;
  updatePeopleSocialFields();
}
function updatePeopleSocialFields() {
  const kind=$('socialKind').value;
  [['socialAssessment','socialTalent','requestAssessment'],['socialRelay','socialClaim','requestReputation'],['socialOath','socialTerms','requestOath']].forEach(([section,input,type])=>{$(section).hidden=kind!==type;$(input).disabled=kind!==type;$(input).required=kind===type;});
}
function peopleConsentDialog(id,accept,who=actor()) {
  const request=(view.peopleRequests||[]).find(r=>r.id===id&&r.recipient===who);if(!request)return;
  dialog(accept?'개인 요청의 참여 수락':'개인 요청 거절',`<p>${esc(peopleRequestNames[request.kind]||'개인 대화')} · ${esc(person(request.proposer)?.name||'제안자 이름 미상')}의 요청</p><p>${request.kind===0?'실연 영역 · '+esc(talentNames[request.talentIndex]):request.kind===2?esc(request.terms):'전달받은 진술의 대화'}</p><p>${year(request.requested)} 전달 · ${year(request.expires)} 응답 기한</p><p>${accept?'수락하면 양측의 실제 참여·노동 시간을 판정하여 작업을 시작합니다. 결과는 완료 뒤에 확인합니다.':'직접 대면한 제안자에게 이 요청에 참여하지 않겠다는 의사를 전달합니다.'}</p>`,()=>issueCommand(accept?'acceptPeopleRequest':'rejectPeopleRequest',id,0,'',who),accept?'참여 수락 제출':'거절 의사 제출');
}
function oathBreakDialog(id,who=actor()) {
  const oath=(view.knownOaths||[]).find(o=>o.id===id&&o.person===who);if(!oath)return;
  dialog('서약의 대면 파기 통지',`<p>${esc(oath.terms)}</p><p>상대 · ${esc(person(oath.other)?.name||'이름 미상')} · ${year(oath.observedMonth)} 마지막 통지</p><p>직접 대면한 현재 당사자에게 파기를 통지합니다. 실제 서약 효과가 종료되고 상대가 파기 사실을 경험합니다. 현재 위치와 작업 가능 여부는 제출할 때 판정합니다.</p>`,()=>issueCommand('breakOath',id,0,'',who),'파기 의사 통지');
}

function decisionSocialPanel(d) {
  const thought=d.decision,relations=d.socialRelations||[];
  const eventText=source=>view.events.find(e=>source===`event:${e.id}`)?.text||source||'근거 미상';
  return `${thought?`<section class="card section"><h3>${view.observer?'실제 AI 판단과 계획':'나의 판단과 계획'}</h3><p>감정 상태 ${n(thought.mood)} / -100~100 · 마지막 돌봄 ${thought.lastCare>0?year(thought.lastCare):'기록 없음'}</p><p>${esc(thought.reason)}</p>${table(['검토한 목표','판단 점수','당시 근거'],thought.candidates.map(c=>`<tr><td>${esc(c.goal)}</td><td>${n(c.score)}</td><td>${esc(c.evidence)}</td></tr>`),'저장된 후보 판단이 없습니다.')}<p class="muted">판단 점수는 실제 후보 비교용 값입니다. 사실이나 성공 확률을 보증하지 않습니다.</p><details data-section="decision-history"><summary>실제 판단 시점과 원인 이력</summary>${[...thought.history].reverse().map(h=>`<article class="listrow"><strong>${year(h.month)} · ${esc(h.goal)}</strong><p>${esc(h.reason)}<br><small>선택 행동 ${esc(actionNames[h.action]||commandNames[h.action]||'행동')} · 검토 확장 ${n(h.expansions)}회</small></p>${h.candidates.map(c=>`<p><small>${esc(c.goal)} · ${n(c.score)} · ${esc(c.evidence)}</small></p>`).join('')}</article>`).join('')||empty('아직 실제 판단 이력이 없습니다.')}</details><details data-section="habits"><summary>완료 행동에서 쌓인 습관 · 0~100점</summary>${Object.keys(thought.habits||{}).length?bars(Object.keys(thought.habits).map(k=>actionNames[k]||commandNames[k]||'행동'),Object.values(thought.habits),100):empty('완료 행동에서 기록한 습관이 없습니다.')}</details></section>`:''}<section class="card section"><h3>${view.observer?'선택 인물의 방향별 관계':'내가 경험한 방향별 관계'}</h3><p class="muted">상대의 숨은 감정과 분리합니다. 신뢰·애정·존중은 -100~100, 원한·의존·의무는 0~100점입니다.</p>${table(['관계 방향','신뢰·애정·존중','원한·의존·의무','실제 시점·출처'],relations.map(r=>`<tr><td>${personLink(r.observer)} → ${personLink(r.other)}</td><td>${n(r.trust)} · ${n(r.affection)} · ${n(r.respect)}</td><td>${n(r.grievance)} · ${n(r.dependency)} · ${n(r.obligation)}</td><td>${year(r.month)}<br>${esc(eventText(r.source))}<br><button onclick="showEvents('person',${r.other})">관련 사건</button></td></tr>`),'내 경험으로 확인한 관계 기록이 없습니다.')}</section>`;
}
function cultivationControls(d) {
  if(d.person.status!=='Alive'||(!view.observer&&d.person.id!==view.actor))return '';
  const c=d.cultivation,who=d.person.id,phase=['준비됨','형성 개시','파단됨','안착 중','회복 중','완료','취소','실패'][c.phase]||'진행 공정 없음';
  return `<div class="section"><p><span class="tag">${phase}</span>${c.trial?' · 실제 겁 관문 대기':''}</p><div class="stack"><button onclick="cultivationPlanDialog(${who})">돌파 준비 계획</button><button onclick="cultivationPlanDialog(${who},'cultivationconvert')">현재 경로 전환</button><button onclick="cultivationPlanDialog(${who},'cultivationauxiliary')">보조 공법 선택</button>${c.phase===0?`<button onclick="issueCommand('cultivationstart',0,0,'',${who})">준비한 형성 개시</button>`:''}${c.phase===1?`<button onclick="issueCommand('${d.person.realm==='금단경'?'cultivationfracture':'cultivationresolve'}',0,0,'',${who})">${d.person.realm==='금단경'?'원영 형성의 금단 파단':'형성 판정 요청'}</button>`:''}${c.phase===2?`<button onclick="issueCommand('cultivationresolve',0,0,'',${who})">파단 후 형성 진행</button>`:''}${[3,4].includes(c.phase)?`<button onclick="issueCommand('cultivationstabilize',0,0,'',${who})">안착·회복 공정 진행</button>`:''}${c.trial?`<button onclick="issueCommand('trial',0,0,'',${who})">실제 겁 관문 진행</button>`:''}<button onclick="issueCommand('cultivationrecover',0,0,'',${who})">수행 기반 회복 요청</button></div><p class="muted">초안 닫기는 작업을 바꾸지 않습니다. 제출하면 실제 자격·지식·공급·권리·노동을 판정합니다.</p></div>`;
}
function cultivationPlanDialog(who=actor(),kind='cultivationprepare') {
  const p=person(who),d=view.detail?.person.id===who?view.detail:null,level=realms.indexOf(p?.realm);
  if(!d?.understanding)return noCandidates('수행 계획','먼저 행동 인물의 상세를 열어 실제로 배운 지식을 확인하세요.');
  const nextRoutes=d.potential?.knownNextRoutes||[];
  const paths=kind==='cultivationprepare'?nextRoutes.map(route=>view.paths.find(path=>path.id===route.path)||(entrySensingChoice(d,route.path)?{id:route.path,realm:level+1,name:'입문 감응 시도',book:''}:null)).filter(path=>path&&path.realm===level+1):view.paths.filter(path=>(d.understanding[path.id]||0)>0&&(kind==='cultivationauxiliary'?path.realm<=level:path.realm===level));
  if(!paths.length)return noCandidates('확인한 수행 선택 없음','이 계획에 쓸 실제 입문 지식이나 배운 경로가 없습니다. 전수나 공법서로 배운 뒤 검토할 수 있습니다.');
  const pills=view.items.filter(i=>i.owner===who&&!i.reserved&&['pill','growthPill','breakthroughPill'].includes(i.definition));
  const entryNotice=kind==='cultivationprepare'&&level===0?'<p class="notice">일반 수행은 입문 토납 준비를 쌓습니다. 감응은 준비 명령으로 따로 시도하며, 연기 운기 공법은 입문 후 별도로 배워야 합니다.</p>':'';
  dialog(kind==='cultivationconvert'?'현재 경로 전환 계획':kind==='cultivationauxiliary'?'보조 공법 계획':'돌파 준비 계획',`${selectField('plannedPath',kind==='cultivationprepare'?'알고 있는 입문·돌파 선택':'실제로 배운 경로',paths.map(path=>`<option value="${esc(path.id)}">${esc(realms[path.realm])} · ${entrySensingChoice(d,path.id)?'입문 감응 시도':esc(path.name)+' · '+esc(path.book)}</option>`).join(''))}${entryNotice}${kind==='cultivationauxiliary'?'':selectField('plannedSupport','사용할 실제 보조 실물',`<option value="0">보조 실물 선택 안 함</option>${pills.map(i=>`<option value="${i.id}">${esc(i.name)} · ${esc(i.quality)}</option>`).join('')}`)}<p>실제 준비와 형성, 안착을 각각 진행합니다. 전환은 기존 진척의 손실과 새 경로의 비용을 판정합니다.</p>${level===0?'':'<p class="error">금단을 파단한 뒤 원영 형성을 중단하면 사망할 수 있습니다. 파단 전에는 현재 단계와 실제 자격을 다시 확인하세요.</p>'}`,()=>issueCommand(kind,kind==='cultivationauxiliary'?0:+$('plannedSupport').value,0,$('plannedPath').value,who),'준비 명령 제출');
}

function newWorld() {dialog('새로운 세계',`<label>세계 시드<input id="seed" type="number" min="0" max="9007199254740991" step="1" required value="42"></label>${selectField('newlaws','새 세계의 법칙','<option value="current">현재 조정값 유지</option><option value="default">기본 법칙으로 시작</option>')}<p>두 반선 시조와 종문 0개로 시작합니다. 현재 세계를 계속하려면 먼저 저장하세요. 기존 저장 슬롯은 유지됩니다.</p>`,()=>send({type:'new',seed:+$('seed').value,useCurrentLaws:$('newlaws').value==='current'}),'새 세계 만들기');}
function loadDialog() {const slot=+$('slot').value;dialog('저장한 세계 불러오기',`<p>슬롯 ${slot+1}의 저장으로 현재 세계를 바꿉니다. 현재 진행을 보존하려면 먼저 저장하세요.</p>`,()=>send({type:'load',slot}),'불러오기');}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('dialog').open){e.preventDefault();$('dialog').close();}else{pauseWorld();if(history.length||selected)back();}return;}
  if($('dialog').open||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||e.ctrlKey||e.metaKey)return;
  if(e.key==='/'&&!e.altKey){const input=$('search');if(input){e.preventDefault();input.focus();}return;}
  if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();back();return;}
  if(e.key===' '&&e.target===document.body){e.preventDefault();toggleRun();}
});
$('nav').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const buttons=[...$('nav').querySelectorAll('button')],index=buttons.indexOf(document.activeElement);if(index<0)return;e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?buttons.length-1:(index+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[next].focus();});
send({type:'view'});

</script>
</body>
</html>
