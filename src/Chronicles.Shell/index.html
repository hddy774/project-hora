<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<title>선로만상록</title>
<style>
:root{--bg:#101a19;--panel:#172624;--line:#2a403b;--ink:#e7ecdf;--muted:#94ada3;--jade:#95d6b2;--gold:#dcb974;--red:#ed9f91;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:#20362f;color:var(--ink);padding:9px 14px;min-height:42px}button:hover,button:focus-visible{border-color:var(--jade);outline:2px solid transparent;background:#2c4b40}button.primary{background:var(--jade);color:#10251c;font-weight:700}button.danger{color:var(--red)}button:disabled{opacity:.4;cursor:wait}input,select{max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:10px}h1,h2,h3,p{margin-top:0}h1{font-family:serif;font-weight:500;font-size:28px;letter-spacing:2px;margin-bottom:3px}h2{font-family:serif;font-weight:500;font-size:25px;margin-bottom:6px}h3{font-size:16px;margin-bottom:12px}small,.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}.appbar{height:92px;padding:18px 30px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:14px;align-items:center}.seal{border:1px solid var(--gold);color:var(--gold);font:25px serif;padding:5px 9px}.topright{white-space:nowrap;text-align:right;font-size:13px}.layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:calc(100vh - 92px)}nav{padding:25px 15px;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;background:none;border-color:transparent;margin-bottom:6px;color:var(--muted)}nav button.active{color:var(--jade);border-color:var(--line);background:var(--panel)}nav .navfoot{font-size:12px;padding:20px 12px;color:var(--muted)}main{padding:25px 32px;max-width:1600px;width:100%;min-width:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 0 20px;margin-bottom:10px;border-bottom:1px solid var(--line)}.toolbar .space{flex:1}.toolbar select{padding:7px}.mode{border:1px solid var(--line);border-radius:30px;color:var(--jade);padding:3px 10px;font-size:12px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:20px;min-width:0}.card .number{font-family:serif;font-size:34px;line-height:1.4;color:var(--jade)}.span2{grid-column:span 2}.section{margin-top:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:flex;gap:8px;flex-wrap:wrap}.tag{font-size:12px;border:1px solid var(--line);padding:2px 7px;border-radius:4px;color:var(--gold)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th,td{padding:12px 14px;border-bottom:1px solid var(--line)}th{font-size:12px;font-weight:500;color:var(--muted);background:var(--panel)}tr:hover td{background:#1b2d29}td button{font-size:13px;padding:5px 10px;min-height:34px}.empty{text-align:center;padding:50px 15px;color:var(--muted)}.listrow{padding:13px 0;border-bottom:1px solid var(--line)}.barrow{display:grid;grid-template-columns:100px 1fr 68px;gap:10px;align-items:center;font-size:13px;margin:9px 0}.bar{height:7px;background:#0c1613;border-radius:4px;overflow:hidden}.bar>i{height:100%;display:block;background:var(--jade)}.map{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}.map button{padding:9px 2px;border-radius:4px;font-size:12px;min-height:58px;background:#1d352e}.map button.unknown{background:#131e1a;color:#526e61}.map button.here{border-color:var(--gold);color:var(--gold)}.notice{border-left:2px solid var(--gold);background:#252c24;padding:12px 16px;font-size:13px;margin:16px 0;color:#c3cbbd}.timeline{border-left:1px solid var(--line);padding-left:20px}.timeline article{position:relative;padding-bottom:20px}.timeline article:before{position:absolute;left:-25px;top:7px;content:'';width:9px;height:9px;border:2px solid var(--gold);background:var(--bg);border-radius:100%}.timeline p{margin:0;font-size:14px}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.spark{width:100%;height:180px}.spark text{fill:var(--muted);font-size:10px}.back{margin-bottom:12px}.toast{position:fixed;bottom:22px;right:22px;max-width:90vw;background:#294839;color:#ecf8ed;box-shadow:0 4px 30px #0006;border:1px solid var(--jade);border-radius:8px;padding:12px 20px;z-index:5;display:none}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;max-width:500px;width:90vw;padding:25px}dialog::backdrop{background:#0009}dialog input,dialog select{width:100%;margin:8px 0}dialog .stack{justify-content:flex-end;margin-top:20px}.lawrow{display:grid;grid-template-columns:1fr 110px 65px;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}.lawrow small{display:block}.lawrow input{width:100%}.chartlegend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:10px}svg{overflow:visible}.footer{font-size:12px;color:var(--muted);padding:30px 0}.hidden{display:none!important}
@media(max-width:900px){main{padding:18px}.layout{grid-template-columns:145px 1fr}.span2{grid-column:auto}.appbar{padding:14px 18px}.map{gap:3px}.map button{font-size:10px}.barrow{grid-template-columns:90px 1fr 50px}}
@media(max-width:620px){.appbar{height:82px}h1{font-size:23px}.brand{gap:10px}.seal{font-size:20px}.topright small{display:none}.layout{display:block}nav{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;overflow-x:auto;gap:4px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}nav button{width:auto;white-space:nowrap;margin:0;padding:7px 12px;min-height:40px;font-size:13px}nav .navfoot{display:none}main{padding:12px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:15px}.card .number{font-size:28px}.wide{grid-column:span 2}.toolbar{gap:6px;padding-bottom:12px}.toolbar button{padding:7px 9px;font-size:13px}.toolbar .space{display:none}.hero{margin:16px 0}.hero h2{font-size:23px}.map button{font-size:9px;min-height:50px;word-break:keep-all}.map{gap:3px}.lawrow{grid-template-columns:1fr 85px 55px}.lawrow button{padding:6px}.toast{bottom:16px;right:16px}.topright{font-size:11px}}
</style>
<header class="appbar"><div class="brand"><div class="seal" aria-hidden="true">仙</div><div><div class="eyebrow">CHRONICLES OF MYRIAD IMMORTAL PATHS</div><h1>선로만상록</h1></div></div><div class="topright"><div id="date">세계를 불러오는 중</div><small id="version"></small></div></header>
<div class="layout"><nav aria-label="주 메뉴" id="nav"></nav><main><div class="toolbar"><span class="mode" id="mode">관찰</span><button id="run" class="primary" onclick="toggleRun()">▶ 시간 흐름</button><select id="speed" aria-label="배속"><option value="1">1배속</option><option value="5">5배속</option><option value="20">20배속</option><option value="100">100배속</option></select><button onclick="advance(1)">1개월</button><button onclick="advance(12)">1년</button><span class="space"></span><button onclick="send({type:'save',slot:+document.getElementById('slot').value})">저장</button><button onclick="send({type:'load',slot:+document.getElementById('slot').value})">불러오기</button><select id="slot" aria-label="저장 슬롯"><option value="0">슬롯 1</option><option value="1">슬롯 2</option><option value="2">슬롯 3</option></select></div><div id="content" aria-live="polite"></div><div class="footer">선로만상록 · 같은 세계, 서로 다른 인연</div></main></div>
<div class="toast" id="toast" role="status"></div><dialog id="dialog"><form method="dialog" id="dialogform"></form></dialog>
<script>
'use strict';
const labels={world:'세계',people:'인물',map:'지도',cultivation:'수행',items:'물품',groups:'세력',market:'시장',events:'연대기',laws:'법칙'};
let view=null,tab='world',selected=0,running=false,busy=false,lastGeneration=-1,queue=Promise.resolve(),search='';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>v==null?'미상':Number(v).toLocaleString('ko-KR'), year=m=>`${Math.floor(m/12)}년 ${m%12+1}월`, person=id=>view.people.find(p=>p.id===id), actor=()=>view.actor||selected||view.people[0]?.id||0;
function toast(message){if(!message)return;$('toast').textContent=message;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
let nativeSequence=0;const nativePending=new Map();if(window.chrome?.webview)window.chrome.webview.addEventListener('message',e=>{const resolve=nativePending.get(e.data.sequence);if(resolve){nativePending.delete(e.data.sequence);resolve(e.data.payload)}});function desktopRequest(request){return new Promise(resolve=>{const sequence=++nativeSequence;nativePending.set(sequence,resolve);window.chrome.webview.postMessage({sequence,request})})}function send(request){queue=queue.then(async()=>{busy=true;try{const raw=window.seonroNative?window.seonroNative.request(JSON.stringify(request)):window.chrome?.webview?await desktopRequest(request):await(await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)})).text();const reply=JSON.parse(raw);if(reply.view.generation<lastGeneration)return;const switched=view&&(reply.view.actor!==view.actor||reply.view.generation!==view.generation);if(switched){search='';selected=reply.view.actor||0;$('content').replaceChildren()}lastGeneration=reply.view.generation;view=reply.view;if(reply.message)toast(reply.message);render()}catch(e){running=false;$('run').textContent='▶ 시간 흐름';toast('요청을 처리하지 못했습니다. 다시 시도하세요.')}finally{busy=false}});return queue}
function issueCommand(kind,target=0,value=0,data='',who=actor()){return send({type:'command',command:{id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),actor:who,kind,target,value,data}})}
function advance(months){return send({type:'advance',months})}function toggleRun(){running=!running;$('run').textContent=running?'Ⅱ 일시정지':'▶ 시간 흐름'}window.pauseWorld=()=>{running=false;$('run').textContent='▶ 시간 흐름'};
setInterval(()=>{if(running&&!busy)advance(+$('speed').value)},833);
function go(next){tab=next;search='';render()}function inspect(id){selected=id;tab='people';send({type:'detail',detail:id})}function back(){selected=0;send({type:'detail',detail:0})}
function header(title,sub,extra=''){return `<div class="hero"><div><div class="eyebrow">${view.observer?'WORLD OBSERVATION':'PERSONAL KNOWLEDGE'}</div><h2>${title}</h2><div class="muted">${sub}</div></div>${extra}</div>`}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>${rows.length?'':'<div class="empty">표시할 기록이 없습니다.</div>'}</div>`}
function bars(names,values,max=10000){if(!values)return '<div class="empty">아직 알지 못하는 정보입니다.</div>';return names.map((name,i)=>`<div class="barrow"><span>${esc(name)}</span><span class="bar"><i style="width:${Math.max(0,Math.min(100,values[i]/max*100))}%"></i></span><span>${n(values[i])}</span></div>`).join('')}
function chart(){const rows=view.census;if(rows.length<2)return '<div class="empty">시간이 흐르면 실제 인구 변화가 기록됩니다.</div>';const max=Math.max(2,...rows.map(x=>x.living));return `<div class="chartlegend"><span>● 실제 생존 인구 · 명</span><span>${year(rows[0].month)} → ${year(rows.at(-1).month)}</span></div><svg class="spark" viewBox="0 0 600 150" role="img" aria-label="월별 실제 생존 인구"><path d="M0 135H600" stroke="#456051"/><polyline fill="none" stroke="#95d6b2" stroke-width="2" points="${rows.map((r,i)=>`${i/(rows.length-1)*590},${135-r.living/max*120}`).join(' ')}"/><text x="0" y="10">${n(max)}명</text></svg>`}
function render(){if(!view)return;$('date').textContent=year(view.month);$('version').textContent=`v${view.version} · ${view.observer?'세계 전체':'개인 인지'} 기준`;$('mode').textContent=view.observer?'관찰 모드':`플레이 · ${person(view.actor)?.name||''}`;$('nav').innerHTML=Object.entries(labels).filter(([key])=>key!=='laws'||view.observer).map(([key,label])=>`<button class="${tab===key?'active':''}" onclick="go('${key}')">${label}</button>`).join('')+'<div class="navfoot">一世一緣<br>한 생, 하나의 인연</div>';if(tab==='laws'&&!view.observer)tab='world';const pages={world:worldPage,people:peoplePage,map:mapPage,cultivation:cultivationPage,items:itemsPage,groups:groupsPage,market:marketPage,events:eventsPage,laws:lawsPage};$('content').innerHTML=pages[tab]();}
function worldPage(){const living=view.people.filter(p=>p.status==='Alive'),latest=view.census.at(-1);return header('만상의 흐름',view.observer?'두 시조에서 시작하는 세계의 현재':'알게 된 사람과 장소에서 바라보는 세계',view.observer?'<button onclick="newWorld()">새 세계</button>':'<button onclick="issueCommand(\'observe\')">관찰로 전환</button>')+`<div class="grid"><div class="card"><small>${view.observer?'실제 생존 인구':'알고 있는 인물'}</small><div class="number">${n(view.observer?living.length:view.people.length)}<small> 명</small></div></div><div class="card"><small>${view.observer?'세계 지점':'발견한 지점'}</small><div class="number">${view.places.length}<small> 곳</small></div></div><div class="card"><small>인지한 종문</small><div class="number">${view.groups.filter(g=>g.kind==='Sect'&&!g.dissolved).length}<small> 개</small></div></div><div class="card"><small>${view.observer?'누적 출생 / 사망':'현재 모드'}</small><div class="number">${view.observer?`${n(latest?.births||0)} / ${n(latest?.deaths||0)}`:'플레이'}</div></div></div><div class="grid section"><div class="card wide span2"><h3>${view.observer?'인구의 발자취':'당신의 시야'}</h3>${view.observer?chart():'<p class="muted">다른 인물의 정보는 마지막 관측에 머무릅니다. 탐색과 만남, 학습으로 시야를 넓혀 보세요.</p>'}</div><div class="card wide"><h3>지금의 인연</h3>${view.people.slice(0,5).map(p=>`<div class="listrow row"><div>${esc(p.name)}<br><small>${esc(p.realm)} · ${n(p.age)}세</small></div><button onclick="inspect(${p.id})">살펴보기</button></div>`).join('')}</div></div><div class="notice">${view.observer?'관찰은 실제 상태 전체를 보여 줍니다. 인물을 선택하고 빙의하면 그 인물의 지식과 권한으로 행동합니다.':'플레이의 미상·지난 관측은 정답으로 자동 갱신되지 않습니다.'}</div>`}
function peoplePage(){if(selected&&view.detail?.person.id===selected)return detailPage();const filtered=view.people.filter(p=>(p.name+p.realm).includes(search));return header('인물과 인연',`${n(view.people.length)}명의 ${view.observer?'실제 기록':'인지 기록'}`,view.observer?'<button onclick="createPerson()">명시적 인물 편입</button>':'')+`<div class="subnav"><input aria-label="인물 검색" placeholder="이름·경지 검색" value="${esc(search)}" oninput="search=this.value;render()"></div>`+table(['인물','경지','나이','위치','상태',''],filtered.slice(0,150).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.realm)} ${p.layer??''}층</td><td>${n(p.age)}세</td><td>${esc(view.places.find(x=>x.id===p.place)?.name||'미상')}</td><td>${esc(({Alive:'생존',Dead:'사망',Ascended:'비승',Departed:'이탈'})[p.status]||p.status)}</td><td><button onclick="inspect(${p.id})">상세</button></td></tr>`))+`<p class="muted">최대 150행 · 검색으로 인물을 좁힐 수 있습니다.</p>`}
function detailPage(){const d=view.detail,p=d.person,own=view.observer||p.id===view.actor;return `<button class="back" onclick="back()">← 인물 목록</button>`+header(esc(p.name),`${esc(p.realm)} ${p.layer??''}층 · ${n(p.age)}세 · 관측 ${year(p.observed)}`,p.status==='Alive'?`<button class="primary" onclick="issueCommand('possess',0,0,'',${p.id})">${view.actor===p.id?'조작 중':'이 인물로 플레이'}</button>`:'')+`<div class="grid"><div class="card"><small>건강</small><div class="number">${n(p.health)}</div></div><div class="card"><small>영석</small><div class="number">${n(p.money)}</div></div><div class="card wide span2"><small>지금의 목표</small><h3>${esc(p.goal||'미상')}</h3><p class="muted">${esc(p.reason||'알 수 없는 판단입니다.')}</p><span class="tag">${esc(p.action||'지난 관측')}</span></div></div>${familyGraph(p.id)}${own&&p.status==='Alive'?actions():''}<div class="grid section"><div class="card wide"><h3>오행 영근 · 0~10000</h3>${bars(['금','목','수','화','토'],d.roots)}</div><div class="card wide"><h3>6대 선천 기반 · 0~10000</h3>${bars(['영근','근골','체질','오성','정신','영혼'],d.aptitudes)}</div><div class="card wide"><h3>생물학적 가계</h3><p>부모: ${[p.parentOne,p.parentTwo].filter(Boolean).map(id=>`<button onclick="inspect(${id})">${esc(person(id)?.name||'미상')}</button>`).join(' ')||'기록 없음'}</p><p>영혼: ${p.soul||'미상'}<br>무예: ${p.martial==null?'미상':p.martial+'경지'}</p></div><div class="card wide"><h3>전투 특성 · 조건별 실제 속성</h3>${bars(['공격','방어','속도','제어','지속','감지','관통','회복'],d.combat,d.combat?Math.max(1,...d.combat):1)}</div><div class="card wide span2"><h3>24개 파생 재능</h3>${bars(['금행','목행','수행','화행','토행','오행조화','토납','운기','정련','무도','신식','추론','법술','전투판단','연단','연기','제부','진법','영농','어수','의술','감정','교섭','통솔'],d.talents)}</div><div class="card wide"><h3>현재 특성과 출처</h3>${d.traits?.map(t=>`<div class="listrow">${esc(t.id)}<br><small>${esc(t.source)}</small></div>`).join('')||'<p class="muted">확인된 특성이 없습니다.</p>'}</div><div class="card wide"><h3>형성 이력</h3>${d.formations?.map(f=>`<div class="listrow">${esc(view.paths.find(x=>x.id===f.path)?.name||'미상 경로')} · 품질 ${n(f.quality)}<br><small>${esc(f.source)}</small></div>`).join('')||'<p class="muted">기록 없음 또는 미상</p>'}</div></div>`}
function familyGraph(id){const center=person(id);const relatives=view.people.filter(p=>p.id===id||p.id===center?.parentOne||p.id===center?.parentTwo||p.parentOne===id||p.parentTwo===id).slice(0,20);if(relatives.length<2)return '';const parents=relatives.filter(p=>p.id===center.parentOne||p.id===center.parentTwo),children=relatives.filter(p=>p.parentOne===id||p.parentTwo===id),positions=new Map([[id,[300,75]]]);parents.forEach((p,i)=>positions.set(p.id,[200+i*200,15]));children.forEach((p,i)=>positions.set(p.id,[40+i*(520/Math.max(1,children.length-1)),135]));const lines=relatives.filter(p=>p.id!==id).map(p=>{const a=positions.get(p.id),b=positions.get(id);return `<path d="M${a[0]},${a[1]} L${b[0]},${b[1]}" stroke="#526e61"/>`}).join('');return `<div class="card section"><h3>생물학적 가계 · 영혼 계보와 별개</h3><svg viewBox="0 0 600 165" role="img" aria-label="부모와 자녀의 생물학적 계보">${lines}${relatives.map(p=>{const [x,y]=positions.get(p.id);return `<g onclick="inspect(${p.id})" style="cursor:pointer"><rect x="${x-44}" y="${y-13}" width="88" height="26" rx="5" fill="#20362f" stroke="#95d6b2"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="#e7ecdf" font-size="11">${esc(p.name)}</text></g>`}).join('')}</svg>${view.observer?`<p class="muted">혼 근원 #${view.souls.find(s=>s.id===center.soul)?.root||center.soul} · 같은 근원의 영혼 ${view.souls.filter(s=>s.root===(view.souls.find(x=>x.id===center.soul)?.root||center.soul)).length}개. 혈연과 분혼 관계는 별도 기록입니다.</p>`:''}</div>`}
function actions(){return `<div class="card section"><h3>실제 행동</h3><div class="stack">${[['gather','식량 채집'],['cultivate','수행'],['martial','무예 단련'],['explore','탐색'],['heal','회복']].map(([kind,label])=>`<button onclick="issueCommand('${kind}')">${label}</button>`).join('')}<button onclick="craftDialog()">제작</button><button onclick="gatherDialog()">재료 채집</button><button onclick="relationship()">관계·출산</button><button onclick="issueCommand('cancel')">작업 취소</button><button onclick="foundDialog()">가문·종문 창설</button></div><small>행동은 실제 시간·재료·장소·자격을 사용합니다. 파단 후 원영 형성을 중단하면 사망합니다.</small></div>`}
function mapPage(){return header('천하의 지형',`${view.places.length}지점 ${view.observer?'전체 관찰':'발견'} · 지점별 실제 공급과 시설`)+`<div class="card"><div class="map">${Array.from({length:100},(_,id)=>{const p=view.places.find(p=>p.id===id);return `<button class="${p?'':'unknown'} ${person(actor())?.place===id?'here':''}" aria-label="${p?esc(p.name):'미발견'}" onclick="${p?`placeDialog(${id})`:''}">${p?`${p.province+1}주<br>${p.id%10+1} · ${p.terrain}`:'미발견'}</button>`}).join('')}</div></div>`+table(['지점','원천','영기','공존 시설','관측 시점'],view.places.map(p=>`<tr><td><button onclick="placeDialog(${p.id})">${esc(p.name)}</button></td><td>${n(p.source)}</td><td>${n(p.qi)}</td><td>${esc(p.facilities.join(' · ')||'자연 지점')}</td><td>${year(p.observed)}</td></tr>`))}
function cultivationPage(){const d=view.detail;return header('수행과 도의 길','형성된 기반과 현재 성장, 다음 경지의 잠재를 구분합니다.')+(d?`<div class="card"><h3>${esc(d.person.name)} · ${esc(d.person.realm)}</h3>${bars(['흡수','정제','순환','체화'],d.processes,d.processes?Math.max(1,...d.processes):1)}<h3 class="section">구조 기반 · 0~10000</h3>${bars(['규모','밀도','순도','완전성','안정','오행조화','경맥연계'],d.components)}</div>${actions()}<div class="card section"><h3>이해한 지식 · 실제 숙련과 분리</h3>${table(['지식','이해'],Object.entries(d.understanding||{}).map(([k,v])=>`<tr><td>${esc(view.paths.find(x=>x.id===k)?.book||({entry:'입문 감응',alchemy:'연단',smith:'연기(煉器)',talisman:'제부',array:'진법',farm:'영농',gather:'채집',combat:'전투'})[k]||k)}</td><td>${n(v)}</td></tr>`))}</div>`:'<div class="empty">인물 화면에서 한 인물을 선택하면 수행 기반과 공법을 볼 수 있습니다.</div>')}
function itemsPage(){return header('실물과 소지품',view.observer?'선택한 인물의 실제 소유·수납·예약 상태':'조작 인물이 접근할 수 있는 실물 · 미감정 품질은 미상')+table(['실물','수량','품계','예약·수납','행동'],view.items.slice(0,200).map(i=>`<tr><td>${esc(i.name)}<br><small>#${i.id} · ${esc(i.source)}</small></td><td>${n(i.quantity)}</td><td>${esc(i.quality)}</td><td>${i.reserved?'예약 #'+i.reserved:i.container?'용기 #'+i.container:'보관 중'}</td><td>${i.reserved?'':`<button onclick="issueCommand('${i.definition.startsWith('path.')?'study':'use'}',${i.id})">${i.definition.startsWith('path.')?'읽기':'사용'}</button> ${i.slot>=0?`<button onclick="issueCommand('equip',${i.id})">장착</button>`:''} <button onclick="offerDialog(${i.id})">출품</button> ${i.capacity>0?'':`<button onclick="storeDialog(${i.id})">수납</button>`}`}</td></tr>`))}
function groupsPage(){return header('가문과 세력','초기 종문 0개 · 실제 창설과 예산, 주권과 봉신을 구분합니다.')+`<div class="grid">${view.groups.map(g=>`<div class="card wide"><div class="row"><h3>${esc(g.name)}</h3><span class="tag">${({Family:'가문',Sect:'종문',Dynasty:'왕조'})[g.kind]}</span></div><p class="muted">수장 ${esc(person(g.leader)?.name||'공석/미상')} · ${g.dissolved?'해산 기록':g.provinces.length?'통치 '+g.provinces.map(p=>p+1+'주').join(', '):g.kind==='Dynasty'?'무영토 왕조':'영토 없음'}</p><p>금고 ${n(g.money)}영석 · 구성원 ${g.members.length}명</p>${Object.entries(g.policies).map(([k,v])=>`<div class="row listrow"><span>${esc(k)} · ${['개방','균형','집중'][v]}</span>${actor()===g.leader&&!g.dissolved?`<button onclick="policyDialog(${g.id},'${k}',${v})">변경</button>`:''}</div>`).join('')}${actor()===g.leader&&!g.dissolved?`<div class="stack section"><button onclick="governDialog(${g.id})">주 통치</button><button onclick="vassalDialog(${g.id})">봉신·독립</button><button class="danger" onclick="issueCommand('dissolve',${g.id})">해산</button></div>`:''}</div>`).join('')}</div>`}
function marketPage(){return header('시장과 계약','실제 판매자·실물·예치금으로 거래합니다. 자동 매입 금고는 없습니다.')+table(['계약','판매자','가격','기한','상태',''],view.contracts.map(c=>`<tr><td>#${c.id} · ${esc(c.kind)}<br><small>실물 #${c.item}</small></td><td>${esc(person(c.seller)?.name||'미상')}</td><td>${n(c.price)}영석</td><td>${year(c.due)}</td><td>${esc(c.status)}</td><td>${c.status==='open'?c.seller===actor()?`<button onclick="issueCommand('withdraw',${c.id})">철회</button>`:c.kind==='auction'?`<button onclick="bidDialog(${c.id},${c.price})">입찰</button>`:`<button onclick="issueCommand('trade',${c.id})">구매</button>`:''}</td></tr>`))}
function eventsPage(){return header('만상의 연대기','실제 사건과 원인, 인물과 세계의 발자취')+`<div class="timeline">${[...view.events].reverse().map(e=>`<article><small>${year(e.month)} · ${esc(e.kind)}</small><p>${esc(e.text)}</p><small>${esc(e.source)}</small>${person(e.actor)?` <button onclick="inspect(${e.actor})">인물</button>`:''}</article>`).join('')||'<div class="empty">아직 인지한 사건이 없습니다.</div>'}</div>`}
function lawsPage(){return header('세계의 법칙','변경은 명시 명령으로 적용되며 기존 임신과 예약의 경계를 보존합니다.')+`<div class="notice">혈연 후손 간 허용 · 양친 모두 금단이 기본입니다. 잠정값은 개발 보정값이며 새 세계는 기본 프리셋에서 시작합니다.</div><input aria-label="법칙 검색" placeholder="이름·ID 검색" value="${esc(search)}" oninput="search=this.value;render()">`+view.laws.filter(l=>(l.name+l.id).includes(search)).map(l=>`<div class="lawrow"><div>${esc(l.name)} ${l.provisional?'<span class="tag">잠정</span>':''}<small>${esc(l.rationale)} · ${esc(l.unit)} · ${l.minimum}~${l.maximum}</small></div><input aria-label="${esc(l.name)}" id="law-${l.id}" type="number" min="${l.minimum}" max="${l.maximum}" value="${l.value}"><button onclick="issueCommand('law',0,+document.getElementById('law-${l.id}').value,'${l.id}',0)">적용</button></div>`).join('')}
function dialog(title,fields,submit){$('dialogform').innerHTML=`<h2>${title}</h2>${fields}<div class="stack"><button value="cancel">취소</button><button type="button" class="primary" id="confirm">명령 제출</button></div>`;$('confirm').onclick=()=>{submit();$('dialog').close()};$('dialog').showModal()}
function options(list,key='id',label='name'){return list.map(x=>`<option value="${esc(x[key])}">${esc(x[label])}</option>`).join('')}
function placeDialog(id){const p=view.places.find(x=>x.id===id);dialog(esc(p.name),`<p>${esc(p.terrain)} · 원천 ${n(p.source)} · 영기 ${n(p.qi)}</p><p>인접: ${p.neighbors.map(n=>esc(view.places.find(x=>x.id===n)?.name||'미상')).join(' · ')}</p><p>선택한 인물이 아는 인접 통로로만 이동합니다.</p>`,()=>issueCommand('travel',id))}
function craftDialog(){const recipes=[['pill','회춘단'],['weapon','현철검'],['tool','채집 도구'],['talisman','호신부'],['array','수행 진기'],['paper','부지'],['ink','영묵'],['bag','저물대'],['cloth','영포'],['armor','호신갑']];dialog('제작 계획',`<select id="recipe">${recipes.map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><p class="muted">보유 지식·실재료를 확인하고 작업 시간을 예약합니다.</p>`,()=>issueCommand('craft',0,0,$('recipe').value))}
function gatherDialog(){dialog('재료 채집','<select id="resource"><option value="herb">청령초</option><option value="ore">적철광</option><option value="wood">청심목</option></select>',()=>issueCommand('gather',0,0,$('resource').value))}
function relationship(){dialog('관계와 출산',`<select id="relationTarget">${options(view.people.filter(p=>p.id!==actor()))}</select><select id="relationKind"><option value="partner">도려 제안</option><option value="conceive">출산 조건 확인·잉태</option><option value="teach">입문 지식 전수</option><option value="attack">전투 개시</option></select><p class="muted">상대 의사·지식·장소·경지 자격을 실제 판정합니다.</p>`,()=>issueCommand($('relationKind').value,+$('relationTarget').value,0,$('relationKind').value==='teach'?'entry':''))}
function foundDialog(){dialog('실제 조직 창설','<select id="groupKind"><option value="family">가문</option><option value="sect">종합 종문</option></select><p>창설 재원과 한 사람의 노동 시간을 사용합니다.</p>',()=>issueCommand('found',0,0,$('groupKind').value))}
function offerDialog(id){dialog('실물 출품','<select id="offerKind"><option value="sale">일반 판매</option><option value="auction">경매</option></select><label>가격 · 영석<input id="price" type="number" min="1" value="10"></label><p>실물 전체 스택을 예약합니다.</p>',()=>issueCommand('offer',id,+$('price').value,$('offerKind').value))}
function bidDialog(id,price){dialog('입찰·영석 예치',`<label>입찰가<input id="bid" type="number" min="${price}" value="${price}"></label>`,()=>issueCommand('bid',id,+$('bid').value))}
function storeDialog(id){const bags=view.items.filter(i=>i.capacity>0&&i.id!==id);dialog('용기 수납',`<select id="container"><option value="0">용기에서 꺼내기</option>${options(bags)}</select>`,()=>issueCommand('store',id,+$('container').value))}
function policyDialog(id,key,value){dialog(esc(key),`<select id="policy"><option value="0">개방</option><option value="1">균형</option><option value="2">집중</option></select><p>시행 준비금과 현재 수장의 시간을 예약합니다.</p>`,()=>issueCommand('policy',id,+$('policy').value,key));$('policy').value=value}
function governDialog(id){dialog('한 주의 실제 통치',`<select id="province">${Array.from({length:10},(_,i)=>`<option value="${i}">${i+1}주</option>`).join('')}</select><p>해당 주 전체의 관측과 실제 가계·행정 거점, 독립 주권이 필요합니다.</p>`,()=>issueCommand('govern',id,+$('province').value))}
function vassalDialog(id){dialog('봉신 관계',`<select id="overlord"><option value="0">독립</option>${options(view.groups.filter(g=>g.id!==id&&g.kind==='Dynasty'&&!g.dissolved))}</select>`,()=>issueCommand('vassal',id,+$('overlord').value))}
function createPerson(){dialog('새 인물의 명시적 편입',`<label>이름<input id="newname" maxlength="40" value="무명"></label><label>시작 위치<select id="newplace">${options(view.places)}</select></label><select id="profile"><option value="0">수정 생식 프로필</option><option value="1">출산 생식 프로필</option></select><p>성인 범인·외부 기원으로 기록합니다. 자산과 숙련을 지급하지 않습니다.</p>`,()=>issueCommand('create',+$('newplace').value,+$('profile').value,$('newname').value,0))}
function newWorld(){dialog('새로운 세계',`<label>세계 시드<input id="seed" type="number" min="0" value="42"></label><p>현재 세계를 계속하려면 먼저 저장하세요. 기존 저장 파일은 유지됩니다.</p>`,()=>send({type:'new',seed:+$('seed').value}))}
send({type:'view'});
</script>
</html>
