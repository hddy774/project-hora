let view = null, tab = 'world', selected = 0, running = false, busy = false, lastGeneration = -1;
let queue = Promise.resolve(), recentCommand = null, history = [], searchByTab = {}, eventFilter = null, groupFocus = 0;
let sectionStates = {}, renderedTab = null;

function pauseWorld() {running = false; $('run').textContent = '▶ 시간 흐름'; $('run').setAttribute('aria-pressed','false');}

  const pending = nativePending.get(e.data?.sequence);

});
function desktopRequest(request) {
  return new Promise((resolve,reject) => {
    const sequence = ++nativeSequence;
    const timer = setTimeout(() => {nativePending.delete(sequence); reject(new Error('bridge timeout'));}, 20000);
    nativePending.set(sequence,{resolve,reject,timer});

  });

function dialog(title,fields,submit,confirmLabel='명령 제출') {
  pauseWorld(); const alreadyOpen=$('dialog').open; if(!alreadyOpen) dialogReturnFocus=document.activeElement;
  $('dialogform').innerHTML=`<h2 id="dialog-title">${esc(title)}</h2>${fields}<p id="dialog-error" class="error" role="alert"></p><div class="stack dialog-actions"><button type="button" onclick="document.getElementById('dialog').close()">닫기</button>${submit?`<button type="submit" class="primary" id="confirm">${esc(confirmLabel)}</button>`:''}</div>`;
  $('dialogform').onsubmit=e=>{e.preventDefault();if(!$('dialogform').reportValidity())return;const result=submit();if(result!==false)$('dialog').close();};
  if(!alreadyOpen) $('dialog').showModal();
  else $('dialogform').querySelector('input,select,textarea,button')?.focus();
}
$('dialog').addEventListener('close',()=>{const el=dialogReturnFocus;dialogReturnFocus=null;if(el?.isConnected)el.focus({preventScroll:true});});

function noCandidates(title,message) {dialog(title,`<p>${esc(message)}</p>`,null);}

}
function policyDialog(id,key,value) {const g=group(id);dialog(key,selectField('policy','시행할 정책','<option value="0">개방</option><option value="1">균형</option><option value="2">집중</option>')+'<p>준비금과 현재 수장의 노동 시간을 예약합니다. 수락은 시행 완료와 다릅니다.</p>',()=>issueCommand('policy',id,+$('policy').value,key,g.leader));$('policy').value=value;}
function governDialog(id) {const g=group(id);dialog('한 주의 실제 통치',selectField('province','통치할 주',Array.from({length:10},(_,i)=>`<option value="${i}">${i+1}주${g.provinces.includes(i)?' · 이미 통치 중':''}</option>`).join(''))+'<p>주 전체의 실제 관측, 거주 가계와 행정 거점, 독립 주권·노동 조건이 필요합니다. 첫 주의 통치로 왕조가 성립합니다.</p>',()=>issueCommand('govern',id,+$('province').value,'',g.leader));}
function releaseDialog(id) {const g=group(id);dialog('통치 주권 반납',selectField('releaseProvince','반납할 통치 주',g.provinces.map(p=>`<option value="${p}">${p+1}주</option>`).join(''))+'<p>해당 주의 주권을 잃습니다. 마지막 영토를 잃어도 왕조는 존속하며 영토 세수는 0이 됩니다. 기존 채무는 유지됩니다.</p>',()=>issueCommand('releaseProvince',id,+$('releaseProvince').value,'',g.leader),'주권 반납 요청');}
function vassalDialog(id) {const g=group(id);dialog('봉신·독립 관계',selectField('overlord','상위 왕조',`<option value="0">독립</option>${options(view.groups.filter(v=>v.id!==id&&v.kind==='Dynasty'&&!v.dissolved))}`)+'<p>주권과 종문 소속은 별개입니다. 순환 봉신 관계는 허용하지 않습니다.</p>',()=>issueCommand('vassal',id,+$('overlord').value,'',g.leader));$('overlord').value=g.overlord||0;}
function dissolveDialog(id) {const g=group(id);dialog('조직 해산 요청',`<p>${esc(g.name)}의 실제 해산을 요청합니다. 남은 재산을 인계하고 주권과 소속을 정리합니다. 해산한 조직은 역사에 남습니다.</p><p>채무와 권한 조건은 실제 명령에서 확인합니다.</p>`,()=>issueCommand('dissolve',id,0,'',g.leader),'해산 요청 제출');}
function applyLaw(id) {const input=$('law-'+id);if(input.reportValidity())issueCommand('law',0,+input.value,id,0);}
function lawResetDialog(id) {const l=view.laws.find(l=>l.id===id);dialog('법칙 기본값 복원',`<p>${esc(l.name)} · ${n(l.value)} → ${n(l.defaultValue)} ${esc(l.unit)}</p><p>${esc(l.rationale)}</p>`,()=>issueCommand('law',0,l.defaultValue,id,0),'기본값 적용');}
function lawPresetDialog() {previewLawBatch(view.laws.filter(l=>l.value!==l.defaultValue).map(l=>({id:l.id,value:l.defaultValue})),'기본 프리셋 차이 검토');}
function previewLawBatch(changes,title) {
  if(!changes.length)return noCandidates(title,'현재 값과의 차이가 없습니다.');
  dialog(title,`<p>${changes.length}개 변경을 검토하세요. 순서대로 적용하며 실패하면 중단합니다. 이미 적용된 앞선 변경은 유지됩니다.</p>${table(['법칙','현재','적용할 값'],changes.map(c=>{const l=view.laws.find(l=>l.id===c.id);return `<tr><td>${esc(l.name)}</td><td>${n(l.value)}</td><td>${n(c.value)} ${esc(l.unit)}</td></tr>`;}))}`,()=>applyLawBatch(changes),'검토한 값 순차 적용');
}
async function applyLawBatch(changes) {const generation=lastGeneration;for(const c of changes){if(!view.observer||lastGeneration!==generation)break;const reply=await issueCommand('law',0,c.value,c.id,0);if(!reply?.result?.accepted){toast('값 적용을 중단했습니다. 현재 적용된 값을 확인하세요.');break;}}}
function exportLaws() {dialog('세계 법칙 값 내보내기','<p>현재 값만 내보냅니다. 세계 저장과 관측 기록은 포함하지 않습니다.</p><label>복사할 값<textarea id="lawExport" rows="12" readonly></textarea></label>',null);$('lawExport').value=JSON.stringify({version:view.version,laws:Object.fromEntries(view.laws.map(l=>[l.id,l.value]))},null,2);$('lawExport').focus();$('lawExport').select();}
function importLaws() {
  dialog('세계 법칙 값 가져오기','<label>내보낸 JSON 값 붙여넣기<textarea id="lawImport" rows="10" required maxlength="16000"></textarea></label><p>알려진 법칙의 정수 값과 허용 범위를 확인한 뒤 차이를 미리 보여 줍니다.</p>',()=>{
    try {const parsed=JSON.parse($('lawImport').value);if(!parsed||!parsed.laws||typeof parsed.laws!=='object'||Array.isArray(parsed.laws))throw new Error();const changes=[];for(const [id,value] of Object.entries(parsed.laws)){const l=view.laws.find(l=>l.id===id);if(!l||!Number.isSafeInteger(value)||value<l.minimum||value>l.maximum)throw new Error();if(l.value!==value)changes.push({id,value});}previewLawBatch(changes,'가져올 법칙 차이 검토');return false;}
    catch(error){$('dialog-error').textContent='형식·정수 값·법칙 이름과 허용 범위를 확인하세요.';return false;}
  },'차이 검토');
}
function createPerson() {dialog('새 인물의 명시적 편입',`<label>이름<input id="newname" maxlength="40" required value="무명"></label>${selectField('newplace','시작 위치',options(view.places))}${selectField('profile','생식 프로필','<option value="0">수정 생식 프로필</option><option value="1">출산 생식 프로필</option>')}<p>성인 범인·외부 기원으로 기록합니다. 자산과 숙련을 지급하지 않습니다. 자연 출생이나 창세 시조로 집계하지 않습니다.</p>`,()=>issueCommand('create',+$('newplace').value,+$('profile').value,$('newname').value,0));}
function newWorld() {dialog('새로운 세계','<label>세계 시드<input id="seed" type="number" min="0" max="9007199254740991" step="1" required value="42"></label><p>두 반선 시조와 종문 0개로 시작합니다. 현재 세계를 계속하려면 먼저 저장하세요. 기존 저장 슬롯은 유지됩니다.</p>',()=>send({type:'new',seed:+$('seed').value}),'새 세계 만들기');}
function loadDialog() {const slot=+$('slot').value;dialog('저장한 세계 불러오기',`<p>슬롯 ${slot+1}의 저장으로 현재 세계를 바꿉니다. 현재 진행을 보존하려면 먼저 저장하세요.</p>`,()=>send({type:'load',slot}),'불러오기');}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('dialog').open){pauseWorld();if(history.length||selected)back();}return;}
  if($('dialog').open||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||e.ctrlKey||e.metaKey)return;
  if(e.key==='/'&&!e.altKey){const input=$('search');if(input){e.preventDefault();input.focus();}return;}
  if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();back();return;}
  if(e.key===' '&&e.target===document.body){e.preventDefault();toggleRun();}
});
$('nav').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const buttons=[...$('nav').querySelectorAll('button')],index=buttons.indexOf(document.activeElement);if(index<0)return;e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?buttons.length-1:(index+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[next].focus();});
send({type:'view'});

</script>
</body>
</html>
